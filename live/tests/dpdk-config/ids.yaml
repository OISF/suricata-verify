%YAML 1.1
---
outputs:
- eve-log:
    enabled: true
    filetype: regular
    filename: eve.json
    types:
    - alert
    - stats:
        totals: true
        threads: false
        interval: 1
dpdk:
  eal-params:
    proc-type: primary
    vdev: net_af_packet0,iface=br0
    no-huge: null
    no-pci: null
    m: 256
  interfaces:
  - interface: net_af_packet0
    threads: 1
    multicast: false
    mempool-size: auto
    mempool-cache-size: auto
    rx-descriptors: 16
    tx-descriptors: 16
    copy-mode: none
    copy-iface: none
threading:
  set-cpu-affinity: true
  cpu-affinity:
  - management-cpu-set:
      cpu:
      - 0
  - worker-cpu-set:
      cpu:
      - all
      mode: exclusive
