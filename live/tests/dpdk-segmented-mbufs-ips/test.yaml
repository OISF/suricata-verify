environment: inline

# Jumbo frames need a 9000 byte MTU along the whole path.
topology:
  mtu: 9000
  networks:
    - client: 10.200.0.2/24
      server: 10.200.0.1/24

requires:
  min-version: 9
  command:
    - grep
    - python3
  features:
    - DPDK
  script:
    - python3 -c 'import os; assert len(os.sched_getaffinity(0)) >= 3'

args:
  - --dpdk
  - --runmode workers

# No namespace owns the addresses of traffic.py, so they are resolved
# statically. Namespaces inherit the IP forwarding setting of the host, so it
# is disabled: the kernels then drop the traffic of traffic.py instead of
# trying to forward it, which adds ICMP redirects and ARP requests.
before: |
  set -e
  ip netns exec client0 sysctl -qw net.ipv4.ip_forward=0
  ip netns exec server0 sysctl -qw net.ipv4.ip_forward=0
  client_mac=$(ip netns exec client0 cat /sys/class/net/client/address)
  server_mac=$(ip netns exec server0 cat /sys/class/net/server/address)
  ip -n client0 neigh replace 10.200.0.9 lladdr "${server_mac}" dev client nud permanent
  ip -n server0 neigh replace 10.200.0.3 lladdr "${client_mac}" dev server nud permanent

# 400 byte segments fit one mbuf, 1400 byte segments span 2 mbufs and 8960
# byte segments (9014 byte frames) 9 mbufs.
client: |
  set -e
  ip netns exec server0 python3 ${TESTDIR}/traffic.py server ${OUTDIR}/server.ready &
  server=$!
  for _ in $(seq 1 40); do
    [ -f ${OUTDIR}/server.ready ] && break
    sleep 0.25
  done
  ip netns exec client0 python3 ${TESTDIR}/traffic.py client
  wait ${server}

checks:
  - shell:
      args: grep -F 'Segmented mbufs detected' suricata.log
  # One normalized segment per session, nothing is dropped.
  - stats:
      ips.replaced: 3
      ips.blocked: 0
      capture.dpdk.segmented_drops: 0
      capture.dpdk.segmented_too_large: 0
      capture.dpdk.shared_mbuf_drops: 0
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 3
