# Port of qa/live/dpdk/dpdk-testsuite.sh: IDS: auto mempool, auto cache (2 threads)
environment: tap
requires:
  features:
    - DPDK
  command:
    - python3
    - ping
    - jq
    - grep
  script:
    - python3 -c 'import os; assert len(os.sched_getaffinity(0)) >= 3'
args:
  - --dpdk
  - --runmode workers
  - -v
  - --include "${OUTDIR}/dpdk.yaml"
  - -S "${TESTDIR}/../dpdk-config/icmp.rules"
  - --set dpdk.interfaces.0.threads=2
  - --set dpdk.interfaces.0.mempool-size=auto
  - --set dpdk.interfaces.0.mempool-cache-size=auto
before: python3 "${TESTDIR}/../dpdk-config/prepare.py" ids 2
client: ip netns exec client0 ping -c 3 -i 0.2 -W 2 10.200.0.1
checks:
  - shell:
      args: grep -F -- '2 packet mempools of size 63, cache size 21' suricata.log
  - stats:
      capture.packets.__gt: 0
  - shell:
      args: jq -e -s 'any(.[]; .event_type == "alert" and .alert.signature_id == 1)' eve.json
