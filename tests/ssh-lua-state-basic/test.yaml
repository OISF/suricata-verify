requires:
  min-version: 9

args:
 - -k none --set default-rule-path=. --simulate-ips

checks:
  # Every state hook fires once. The client direction reaches
  # banner, kex and session, as does the server direction; each
  # rule's lua assertion checks the proto version of the direction
  # it is named after.
  - filter:
      count: 1
      match:
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        alert.signature_id: 2
  - filter:
      count: 1
      match:
        alert.signature_id: 3
  - filter:
      count: 1
      match:
        alert.signature_id: 4
  - filter:
      count: 1
      match:
        alert.signature_id: 5
  - filter:
      count: 1
      match:
        alert.signature_id: 6
  # No failure: the ssh object logs both banners and no error.
  - filter:
      count: 1
      match:
        event_type: ssh
        ssh.client.proto_version: "2.0"
        ssh.server.proto_version: "2.0"
        not-has-key:
          - ssh.client.error
          - ssh.server.error
