# Over-long reply with no LF, mid-slice; see README.md.

requires:
  min-version: 9

args:
- -k none --set app-layer.protocols.ftp.max-line-length=32

checks:
  - filter:
      count: 3
      match:
        event_type: ftp

  - filter:
      count: 1
      match:
        event_type: ftp
        ftp.command: USER
        ftp.completion_code: ["331", "550"]
        ftp.reply: ["ok", "BBBBBBBBBBBBBBBBBBBBBBBBBBBB"]
        ftp.reply_truncated: true

  # The "CCCC" remainder of the truncated reply must not be attached, and the
  # reply behind it must be. Matching reply exactly covers both: a parsed
  # remainder would show up as ["CCCC", "done"].
  - filter:
      count: 1
      match:
        event_type: ftp
        ftp.command: PWD
        ftp.completion_code: ["226"]
        ftp.reply: ["done"]
        ftp.reply_received: "yes"
        ftp.reply_truncated: false

  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.event: response_command_too_long
