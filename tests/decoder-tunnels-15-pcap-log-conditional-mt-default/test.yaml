requires:
  min-version: 9

args:
  - --runmode=single
  - --set multi-detect.config-path=${TEST_DIR}
  - --set multi-detect.1.default-rule-path=${TEST_DIR}
  - --set multi-detect.2.default-rule-path=${TEST_DIR}

checks:
  - filter:
      count: 3
      match:
        event_type: alert
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        tenant_id: 2
        tunnel_id: 2
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
        tunnel.src_ip: 192.168.1.3
        not-has-key: [tunnel_id, tenant_id]
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 3
        not-has-key: [tunnel, tenant_id]
  # the default tenant inspects the unknown tunnel and not tunneled traffic
  # with the rules of the master configuration, so their alerting flows are
  # logged
  - file-compare:
      filename: log.pcap.1700000000
      expected: expected/log.pcap.1700000000
