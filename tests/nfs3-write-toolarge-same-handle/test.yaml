args:
  # the synthetic capture carries zeroed checksums
  - -k
  - none
  - --set app-layer.protocols.nfs.max-write-size=4096

requires:
  min-version: 8.0.7

pcap: input.pcap

checks:
  # the oversized write is rejected on the first transaction
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.app_proto: nfs
        anomaly.event: write_request_too_large
        tx_id: 0
  # the rejected transaction is logged
  - filter:
      count: 1
      match:
        event_type: nfs
        nfs.procedure: WRITE
        nfs.file_tx: true
        rpc.xid: 1
  # the follow-up write on the same handle is a NEW transaction
  # (the rejected one is closed): no reuse, no desync
  - filter:
      count: 1
      match:
        event_type: nfs
        nfs.procedure: WRITE
        nfs.file_tx: true
        rpc.xid: 2
  - shell:
      args: test "$(grep -Ec 'malformed' eve.json)" -eq 0
  # the follow-up file is stored intact
  - filter:
      count: 1
      match:
        event_type: fileinfo
        fileinfo.sha256: "7aaf34db1c7fcb2b24da4106424293956f66c4762412ec0a963e61abcb672d92"
        fileinfo.stored: true
