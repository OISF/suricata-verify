requires:
  min-version: 9
args:
  - -k none
  - --set app-layer.protocols.imap.enabled=yes
pcap: input.pcap

checks:
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.requests[0]: A1 APPEND INBOX {4}
        imap.responses[0]: A1 NO APPEND rejected
        src_port: 42010
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 2
        imap.requests[0]: A2 IDLE
        imap.requests[1]: DONE
        imap.responses.__len: 2
        imap.responses[0]: + idling
        imap.responses[1]: A2 OK IDLE completed
        src_port: 42010
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.requests[0]: A3 APPEND INBOX {4}
        imap.responses[0]: A3 BAD APPEND rejected
        src_port: 42010
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 2
        imap.requests[0]: A4 IDLE
        imap.requests[1]: DONE
        imap.responses.__len: 2
        imap.responses[0]: + idling
        imap.responses[1]: A4 OK IDLE completed
        src_port: 42010
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A5 APPEND INBOX {77}
        imap.responses.__len: 2
        imap.responses[0]: + Ready for literal
        imap.responses[1]: A5 OK APPEND completed
        src_port: 42010
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A6 NOOP
        imap.responses[0]: A6 OK NOOP completed
        src_port: 42010
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 101
        flow.src_port: 42010
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 102
        flow.src_port: 42010
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 201
        flow.src_port: 42020
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 2
        imap.requests[0]: A1 SEARCH TEXT {3+}
        imap.requests[1]: SUBJECT secret
        imap.responses[1]: A1 OK SEARCH completed
        src_port: 42020
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.requests[0]: A2 LOGIN <redacted>
        imap.responses[0]: A2 OK LOGIN completed
        src_port: 42020
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 301
        flow.src_port: 42030
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 302
        flow.src_port: 42030
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 303
        flow.src_port: 42030
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.responses.__len: 2
        imap.responses[0]: '* LIST () "/" {5}'
        imap.responses[1]: A1 OK LIST completed
        src_port: 42030
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A2 STATUS INBOX (MESSAGES)
        imap.responses.__len: 2
        imap.responses[0]: '* STATUS {5}'
        imap.responses[1]: A2 OK STATUS completed
        src_port: 42030
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A3 ID NIL
        imap.responses.__len: 2
        imap.responses[0]: '* ID ({4}'
        imap.responses[1]: A3 OK ID completed
        src_port: 42030
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.responses.__len: 2
        imap.responses[0]: '* LIST () "/" {7}'
        imap.responses[1]: A4 OK LIST completed
        src_port: 42030
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A5 NOOP
        imap.responses.__len: 2
        imap.responses[0]: '* OK still here {3}'
        imap.responses[1]: A5 OK NOOP completed
        src_port: 42030
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A6 NOOP
        imap.responses.__len: 1
        imap.responses[0]: A6 OK NOOP completed
        src_port: 42030
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A7 FETCH 1 BODY[]
        imap.responses.__len: 2
        imap.responses[0]: '* 1 FETCH (BODY[] {21})'
        imap.responses[1]: A7 OK FETCH completed
        src_port: 42030
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.requests[0]: A1 LOGIN <redacted>
        imap.responses[0]: A1 NO LOGIN failed
        src_port: 42040
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.requests[0]: A2 AUTHENTICATE PLAIN <redacted>
        imap.responses[0]: A2 NO AUTHENTICATE failed
        src_port: 42040
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.requests[0]: A3 AUTHENTICATE XOAUTH2 <redacted>
        imap.responses[0]: A3 NO AUTHENTICATE failed
        src_port: 42040
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.requests[0]: A4 AUTHENTICATE PLAIN
        imap.responses[0]: '+ '
        imap.responses[1]: A4 NO AUTHENTICATE failed
        src_port: 42040
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.requests[0]: A5 LOGIN <redacted>
        imap.responses.__len: 3
        imap.responses[0]: + continue
        imap.responses[1]: + continue
        imap.responses[2]: A5 NO LOGIN failed
        src_port: 42040
  - shell:
      args: '! grep -Fq -e ''login-user-secret'' -e ''login-password-secret'' -e ''literal-login-user-secret'' -e ''literal-login-password-secret'' -e ''AHBsYWluLXVzZXItc2VjcmV0AHBsYWluLXBhc3N3b3JkLXNlY3JldA=='' -e ''dXNlcj1vYXV0aC11c2VyLXNlY3JldAFhdXRoPUJlYXJlciBvYXV0aC10b2tlbi1zZWNyZXQBAQ=='' -e ''Y29udGludWF0aW9uLXVzZXItc2VjcmV0AGNvbnRpbnVhdGlvbi1wYXNzd29yZC1zZWNyZXQ='' eve.json'
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 1
  - stats:
      app_layer.error.imap.parser: 0
