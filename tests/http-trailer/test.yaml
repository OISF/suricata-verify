requires:
  min-version: 9

args:
  # inline makes it easier to reason about pcap_cnt
  - -k none --set stream.inline=true

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 3
  - filter:
      # should alert only once for one tx
      count: 1
      match:
        event_type: alert
        alert.signature_id: 4
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 5
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 20
        # delayed until trailer is seen
        pcap_cnt: 7
