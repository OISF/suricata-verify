requires:
    min-version: 9
    pcap: false

args:
    - --engine-analysis
    - --set engine-analysis.rules=yes

# The anchored content is on a transformed buffer and still gets the 'exact'
# suggestion.
checks:
    - shell:
        args: grep -c "the 'exact' keyword expresses this" rules.json | xargs
        expect: 1
