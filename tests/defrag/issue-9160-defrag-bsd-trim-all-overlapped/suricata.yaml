%YAML 1.1
---
# With no host-os-policy mapping configured, the test uses Suricata's built-in
# BSD reassembly policy.
defrag:
  memcap: 32mb
  hash-size: 65536
  trackers: 65535
  max-frags: 65535
  prealloc: yes
  timeout: 60

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            packet: yes
