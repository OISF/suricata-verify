%YAML 1.1
---

stats:
  enabled: yes

app-layer:
  protocols:
    dnp3:
      enabled: yes
      detection-ports:
        dp: 20000
      max-points: 200000

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - stats:
            totals: yes
            threads: no
            deltas: no
