args:
  # the synthetic capture carries zeroed checksums
  - -k
  - none

requires:
  min-version: 8.0.8

pcap: input.pcap

checks:
  # the split lands INSIDE the XDR fill (all data + 1 of 3 fill bytes
  # buffered): the tracker's fill accounting must absorb the buffered
  # fill byte so the file content stays exact and the framing clean
  - filter:
      count: 1
      match:
        event_type: fileinfo
        fileinfo.sha256: "7d5013fbaf9409217b5094ce5785bd4669def0023909c59d880ea8866e0d3c85"
        fileinfo.stored: true
  - filter:
      count: 1
      match:
        event_type: fileinfo
        fileinfo.sha256: "04ffd92aef8aafe6f4f8388bc9f7c5b0d39eae37128b1ca693647b8569f8e629"
        fileinfo.stored: true
  - shell:
      args: test "$(grep -Ec 'malformed' eve.json)" -eq 0
