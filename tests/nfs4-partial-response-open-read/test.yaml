requires:
  min-version: 9

pcap: input.pcap

checks:
  # a fragmented OPEN; GETFH; READ reply: the response scanner skips the
  # successful OPEN result (stateid + change_info + result_flags + fattr4
  # bitmap + file_delegation4) to reach the within-limit READ, so the
  # record completes and the 8192-byte read is inspected (fileinfo), NOT
  # rejected as malformed.
  - filter:
      count: 1
      match:
        event_type: fileinfo
        fileinfo.size: 8192
  - shell:
      args: test "$(grep -Ec 'malformed_data' eve.json)" -eq 0
