requires:
  min-version: 9

args:
- -k none
- --set stream.midstream=true
- --set app-layer.protocols.nfs.enabled=yes

pcap: input.pcap

checks:
  # the v3 LOOKUP reply arrives split across two TCP segments. Before the
  # metadata-partial fix the segmented reply was skipped (no namemap
  # entry, no response fileinfo); now it is parsed and completed, so the
  # response fileinfo carries the looked-up filename
  - filter:
      count: 1
      match:
        event_type: nfs
        proto: TCP
        nfs.version: 3
        nfs.procedure: LOOKUP
        nfs.type: response
        nfs.filename: segfile
        nfs.hhash: 85568d92
        rpc.xid: 285212673
