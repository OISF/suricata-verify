        alert.signature_id: 9194001
  - filter:
      count: 1
      match:
        event_type: fileinfo
        src_port: 42001
        fileinfo.state: CLOSED
        fileinfo.size: 415
        fileinfo.sha256: "3aeaa2b3c3191ee1808195d3d8acd3ea4968fff11823b331acea399037719d21"
  # split-a-pad2 (sport 42002)
  - filter:
