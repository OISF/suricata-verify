requires:
  # Fixed in 8.0.8 and 9.0.0 (Redmine #9194 / backport #9195).
  min-version: 9

args:
  - -k none
  - --runmode single

# Redmine #9194 NFSv3 WRITE XDR-padding split. Each flow writes one file,
# COMMITs it (FILE_SYNC for the e-case), then LOOKUPs. Fixed expectation for
# every flow: the LOOKUP is parsed and alerts, the file is CLOSED with its
# exact length and the sha256 of its data (pad is not file data), with no
# malformed_data anomaly and no NFS parser error. On vulnerable builds the
# split/continuation flows lose the LOOKUP alert and truncate the file.
#
# The chunk2 flows (h-k) write a second, aligned 512-byte chunk to the same
# handle right after the first chunk's pad: 926 bytes, sha256 over both
# chunks. They only pass if the late pad bytes reached the file tracker; a
# fix that only skips them in the stream keeps the parser in sync (alert, no
# anomaly, no parser error) but leaves the tracker's fill bytes set, so the
# second chunk truncates the file at 414 bytes.
checks:
  # control-pad1 (sport 41001)
  - filter:
      count: 1
      match:
        event_type: alert
        src_port: 41001
        alert.signature_id: 9194001
  - filter:
      count: 1
      match:
        event_type: fileinfo
        src_port: 41001
        fileinfo.state: CLOSED
        fileinfo.size: 415
        fileinfo.sha256: "c129edc074593d4f0841a4d97383735dab0df174edc5c8260e9a692fbb31cab9"
  # control-pad2 (sport 41002)
  - filter:
      count: 1
      match:
        event_type: alert
        src_port: 41002
        alert.signature_id: 9194001
  - filter:
      count: 1
      match:
        event_type: fileinfo
        src_port: 41002
        fileinfo.state: CLOSED
        fileinfo.size: 414
        fileinfo.sha256: "d239f944e8a08eae7259549b5a060f3bafd3df3e5f4fb8183e9511f7b712680b"
  # control-pad3 (sport 41003)
  - filter:
      count: 1
      match:
        event_type: alert
        src_port: 41003
        alert.signature_id: 9194001
  - filter:
      count: 1
      match:
        event_type: fileinfo
