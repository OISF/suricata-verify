%YAML 1.1
---
# A partial (incomplete) NFSv4 compound request with a SETATTR operation
# carrying an empty attribute bitmap (attr_cnt=0) before the WRITE: the RPC
# fragment claims the full record but only a fraction is present (PUTFH +
# SETATTR(stateid, empty bitmap -- no bitmap words, no fields blob) + WRITE with a claimed
# 4096-byte payload). Before the fix the scan delegated the SETATTR to the
# regular parser, which reads a first bitmap word even for attr_cnt=0 and
# then a fields blob whose length it takes from the WRITE op's bytes: the
# advance misaligned the next op tag, the scan aborted, the oversized WRITE
# was never rejected and the record kept buffering toward the claimed (up to
# 31-bit RPC length) record size. After the fix the scan advances leading
# ops by their declared length fields only (stateid + attr_cnt words +
# fields blob) and rejects the WRITE mid-flow.

requires:
  min-version: 8.0.7

pcap: input.pcap
args:
  - --set app-layer.protocols.nfs.max-write-size=1024

checks:
  - shell:
      args: test "$(grep -Ec 'write_request_too_large' eve.json)" -ge 1
  - shell:
      args: test "$(grep -Ec 'malformed_data' eve.json)" -eq 0
  - shell:
      args: test "$(grep -Ec 'too_many_transactions' eve.json)" -eq 0
  # the rejected WRITE is logged mid-flow (pcap_cnt present) with the file
  # transaction completed, not left open
  - filter:
      count: 1
      match:
        event_type: nfs
        nfs.procedure: "38"
        nfs.file_tx: true
        pcap_cnt: 7
  - filter:
      count: 1
      match:
        event_type: flow
        app_proto: nfs
