requires:
  min-version: 9

pcap: input.pcap

args:
  - --set app-layer.protocols.nfs.max-write-size=49152

checks:
  # NFSv3 over UDP. FSINFO-free handshake (LOOKUP), then a single 64512B
  # WRITE datagram (max valid UDP payload keeps the claim real). The
  # configured max-write-size is lowered to 48KiB: the shared v3 request
  # handler must reject with write_request_too_large on UDP exactly as it
  # does on TCP, log the rejected file transaction (complete on reject),
  # and not produce malformed_data since the datagram itself is well
  # formed. No --set of any other limit: the queue paths stay uninvolved.
  - shell:
      args: test "$(grep -Ec 'write_request_too_large' eve.json)" -ge 1
  - shell:
      args: test "$(grep -Ec 'too_large' eve.json)" -eq "$(grep -Ec 'write_request_too_large' eve.json)"
  - shell:
      args: test "$(grep -Ec 'malformed_data' eve.json)" -eq 0
  - filter:
      count: 1
      match:
        event_type: nfs
        nfs.procedure: WRITE
  - filter:
      count: 1
      match:
        event_type: flow
        app_proto: nfs
