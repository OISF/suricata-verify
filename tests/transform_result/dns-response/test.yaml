requires:
  min-version: 9

pcap: ../../dns-eve-v2-udp-nxdomain-soa/dns-udp-nxdomain-soa.pcap

args:
  - -k none

checks:
  # must_error fires because at least one rrname fails strict base64 decode
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
  # must_succeed does not fire because the transform signals an error
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 2
