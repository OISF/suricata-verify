requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

pcap: ../../tls/tls-fingerprint-alert/input.pcap

checks:
# the out-of-scope < rule provides no pending-phase coverage, so the prior state
# (client_started) must be dropped by the default app policy
- filter:
    count: 1
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
      direction: to_server
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 210
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 211
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: drop
      flow.alerted: false
