requires:
  min-version: 9
args:
- --simulate-ips
- -k none
pcap: ../../tls/tls-client-hello-frag-01/dump_mtu300.pcap
checks:
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: firewall default app policy
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 101
      pcap_cnt: 6
      alert.action: allowed
      firewall.hook: tls:client_cert
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: accept
      flow.alerted: true
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 100
