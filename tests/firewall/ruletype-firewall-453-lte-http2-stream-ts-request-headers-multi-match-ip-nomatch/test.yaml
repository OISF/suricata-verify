requires:
  min-version: 9
args:
- --simulate-ips
- -k none
pcap: ../../http2-bugfixes/input.pcap
checks:
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: firewall default app policy
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 101
      pcap_cnt: 5
      alert.action: allowed
      firewall.hook: http2:stream:request_headers
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: accept
      flow.alerted: true
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 100
