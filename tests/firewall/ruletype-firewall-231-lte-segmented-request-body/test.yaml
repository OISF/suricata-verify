requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

pcap: input.pcap

checks:
# the keyword matches in the second body segment; the provisional no-match of the
# first segment must not have dropped the flow before the data could arrive
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 211
      alert.action: allowed
      firewall.hook: http:request_body
      firewall.policy: accept:flow,alert
      pcap_cnt: 8
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: accept
      flow.alerted: true
