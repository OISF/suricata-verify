requires:
  min-version: 9

pcap: ../../tls/tls-random/input.pcap

# the invalid combination rules should make the engine error out
exit-code: 1

args:
  - --simulate-ips

checks:
- shell:
    args: grep "action 'config' is not supported in threat detection rules with firewall mode" stderr | wc -l
    expect: 1
