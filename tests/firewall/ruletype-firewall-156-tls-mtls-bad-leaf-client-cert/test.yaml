# An mTLS session whose client Certificate message carries a garbage
# leaf (not an ASN.1 SEQUENCE) followed by a valid certificate, sent
# after a CertificateRequest (which sets the need-client-cert
# condition), and whose next handshake message is a ClientKeyExchange
# (pcap_cnt 8). The undecodable leaf is skipped - it must not abort
# the message:
# - exactly one INVALID_CERTIFICATE decoder event is raised for the
#   bad leaf (pcap_cnt 7);
# - the rest of the client chain is still decoded: the client
#   certificate phase data is filled from the first decodable
#   certificate (the client object of the tls log is only emitted when
#   the server certificate data exists as well, so the logged
#   certificate data is pinned by the server-track sibling test
#   ruletype-firewall-155 and the chain content by the unit test);
# - the certificate phase data is incomplete (the leaf is missing),
#   so the client_cert phase is never entered: sid 1562 never fires;
# - the incomplete-data condition survives the following
#   ClientKeyExchange: the certificate data alone must not establish
#   the data phase, so sid 1563 (client_data) never fires either and
#   the client track stays in client_hello;
# - the failure is not an app-layer error: the message bytes are
#   consumed, the rest of the flow is parsed, and nothing is dropped -
#   every phase state the session enters carries an explicit accept
#   rule (see firewall.rules), so no implicit default app policy drop
#   either.
#
# The pcap is crafted by craft-pcap.py (see that file); the valid
# certificate body is the committed client_cert.der (the same
# self-signed X.509 certificate as ruletype-firewall-153/155).
requires:
  min-version: 9

pcap: input.pcap

args:
  - --simulate-ips
  - -k none

checks:
# the client and server hello phases are entered by the valid hellos
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 1560
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 1564
# the client_hello state rule is evaluated on the ClientHello record,
# the certificate record and the ClientKeyExchange record (the bad
# leaf suppressed the phase advance, so the client track is still in
# client_hello on all of them)
- filter:
    count: 3
    match:
      event_type: alert
      alert.signature_id: 1561
# the server_hello state rule is evaluated on the ServerHello record
# and on the CertificateRequest record (the server sends no
# certificate, so the server track stays in server_hello)
- filter:
    count: 2
    match:
      event_type: alert
      alert.signature_id: 1565
# the certificate phase data is incomplete: the client_cert phase is
# never entered
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 1562
# the incomplete-data condition survives the ClientKeyExchange: the
# data phase is not established from the incomplete certificate data
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 1563
# the bad leaf is flagged once on the certificate record
- filter:
    count: 1
    match:
      event_type: anomaly
      anomaly.event: INVALID_CERTIFICATE
      anomaly.app_proto: tls
      pcap_cnt: 7
# no drop at all: the decode failure is not an app-layer error
- filter:
    count: 0
    match:
      event_type: flow
      flow.action: drop
# no packet or app state was dropped by rules or by the implicit
# default app policy
- filter:
    count: 1
    match:
      event_type: stats
      stats.firewall.accepted: 9
      stats.firewall.blocked: 0
      stats.firewall.drop_reason.rules: 0
      stats.firewall.drop_reason.default_app_policy: 0
