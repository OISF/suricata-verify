requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none
  - --runmode single

pcap: ../ruletype-firewall-185-bypass-td-post-match-side-effects/input.pcap

checks:
# The IP-only rule matched the first flow.
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 100003
      src_port: 40001

# Control: the second flow is inspected.
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 100005

# The point: the toggle ran once, so the xbit is set.
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 100004

- filter:
    count: 1
    match:
      event_type: stats
      stats.flow.end.state.local_bypassed: 0
      stats.ips.blocked: 0
      stats.firewall.blocked: 0
