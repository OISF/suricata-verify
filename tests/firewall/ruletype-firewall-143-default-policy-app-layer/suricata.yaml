%YAML 1.1
---

stats:
  enabled: yes
  interval: 8

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - stats
        - flow
        - alert
        - dns
        - drop:
            alerts: yes
            flows: all

firewall:
  policies:
    packet:
      filter: [ "accept:hook" ]
    app:
      default-policy: [ "accept:hook" ]
