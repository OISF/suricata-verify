%YAML 1.1
---
requires:
  min-version: 9
args:
  - --simulate-ips
  - -k none
pcap: ../lte-matrix-data/http1.pcap
checks:
  # a match at hook 2 covers the states below it, so it decides the flow even
  # though the hook 0 rule is still pending.
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 110
        alert.action: allowed
        firewall.hook: http:request_headers
        firewall.policy: accept:flow,alert
        pcap_cnt: 10
  - filter:
      count: 1
      match:
        event_type: flow
        flow.action: accept
        flow.alerted: true
  # the pending hook 0 non-match must not get to apply the app default policy.
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 2201001
