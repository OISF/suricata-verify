requires:
  min-version: 9
args:
- --simulate-ips
- -k none
pcap: ../lte-matrix-data/http1.pcap
checks:
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: firewall default app policy
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 100
      pcap_cnt: 12
      alert.action: allowed
      firewall.hook: http:request_body
      firewall.policy: accept:flow,alert
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 6
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 99
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: accept
      flow.alerted: true
