%YAML 1.1
---

stats:
  enabled: yes
  interval: 8

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - stats
        - flow
        - alert
        - http2
        - drop:
            alerts: yes
            flows: all

firewall:
  policies:
    app:
      http2:
        default-policy: [ "drop:flow", "alert" ]
        stream:
          default-policy: [ "accept:hook" ]
