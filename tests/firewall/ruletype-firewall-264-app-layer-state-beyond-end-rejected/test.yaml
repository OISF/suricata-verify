# app-layer-state with mode '>' at or beyond the protocol's completion state
# can never match and is rejected at load, which is fatal under
# --init-errors-fatal (how the framework runs suricata).
requires:
  min-version: 9

pcap: false

args:
  - -T

exit-code: 1

checks:
- shell:
    args: grep -c 'is not below the completion state' stderr
    expect: 1
