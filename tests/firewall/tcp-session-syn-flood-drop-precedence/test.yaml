requires:
  min-version: 9

pcap: input.pcap

args:
  - --simulate-ips
  - -k none

exit-code: 1

checks:
  # detection_filter keyword cannot be used with Firewall rules, for now
  - shell:
      args: grep "keyword 'detection_filter' is not supported with firewall rules" stderr | wc -l
      expect: 1
