%YAML 1.1
---

stats:
  enabled: yes
  interval: 8

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - stats
        - flow
        - alert
        - drop:
            alerts: yes
            flows: all

firewall:
  policies:
    default-policy: [ "accept:hook" ]
    packet:
      default-policy: [ "reject:packet" ]
      pre-flow: [ "accept:hook" ]
      pre-stream: [ "accept:hook" ]
