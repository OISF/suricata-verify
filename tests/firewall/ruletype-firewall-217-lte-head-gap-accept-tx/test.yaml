requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

pcap: ../../tls/tls-client-hello-frag-01/dump_mtu300.pcap

checks:
# client_started is auto-accepted while the < rule is pending (its partial match acts as an accept:hook for the prior states), so no
# default app policy drop may happen for it
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
# no explicit drop rule exists in this ruleset
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall rules"
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 310
      alert.action: allowed
      firewall.hook: tls:client_hello
      firewall.policy: accept:tx,alert
      pcap_cnt: 6
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 311
- filter:
    count: 1
    match:
      event_type: flow
      flow.state: closed
      flow.alerted: true
