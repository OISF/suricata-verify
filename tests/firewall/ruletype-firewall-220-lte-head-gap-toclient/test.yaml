requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

pcap: ../../tls/tls-client-hello-frag-01/dump_mtu300.pcap

checks:
# the to_client prior state is auto-accepted while the < rule is pending (its partial match acts as an accept:hook for the prior states),
# so no default app policy drop may happen for it
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
      direction: to_client
# no explicit drop rule exists in this ruleset
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall rules"
- filter:
    count: 2
    match:
      event_type: alert
      alert.signature_id: 701
      alert.action: allowed
      firewall.hook: tls:client_started
      firewall.policy: accept:hook,alert
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 702
      alert.action: allowed
      firewall.hook: tls:client_hello
      firewall.policy: accept:hook,alert
      pcap_cnt: 6
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 703
      alert.action: allowed
      firewall.hook: tls:client_cert
      firewall.policy: accept:hook,alert
      pcap_cnt: 6
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 704
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 705
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 621
      alert.action: allowed
      firewall.hook: tls:server_hello
      firewall.policy: accept:flow,alert
      pcap_cnt: 10
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 622
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: accept
      flow.alerted: true
