requires:
  min-version: 8.0.8

args:
  - --simulate-ips
  - -k none
  # one thread, so that every flow runs on the thread that inspected the
  # previous one
  - --runmode single

checks:
  - filter:
      count: 3
      match:
        event_type: flow
        app_proto: http
        flow.pkts_toserver: 18
        flow.pkts_toclient: 9
        flow.state: established
        not-has-key: flow.action
  - filter:
      count: 9
      match:
        event_type: alert
        alert.signature_id: 1021
  - filter:
      count: 72
      match:
        event_type: alert
        alert.signature_id: 1023
  - filter:
      count: 24
      match:
        event_type: alert
        alert.signature_id: 100
  - filter:
      count: 24
      match:
        event_type: alert
        alert.signature_id: 101
  # the rules that set a transaction bit outside of an app-layer hook: the
  # IP-only rule on the first packet of each direction of every flow, the
  # packet rule on every established packet
  - filter:
      count: 6
      match:
        event_type: alert
        alert.signature_id: 200
  - filter:
      count: 72
      match:
        event_type: alert
        alert.signature_id: 201
  - filter:
      count: 0
      match:
        event_type: drop
  - filter:
      count: 1
      match:
        event_type: stats
        stats.ips.accepted: 81
        stats.ips.blocked: 0
