requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

checks:
# the request prior state is auto-accepted while the < rule is pending (its partial match acts as an accept:hook for the prior states), so
# no default app policy drop may happen for it
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
      direction: to_server
# no explicit drop rule exists in this ruleset
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall rules"
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 210
      alert.action: allowed
      firewall.policy: accept:flow,alert
      pcap_cnt: 1
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 211
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 1003
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 1004
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: accept
      flow.alerted: true
