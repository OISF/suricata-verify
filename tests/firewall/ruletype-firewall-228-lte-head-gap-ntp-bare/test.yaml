requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

checks:
# the bare < rule covers the prior state and matches at completion: the request
# must be accepted, so no default app policy drop may happen
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
# no drop rule exists in this ruleset
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall rules"
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 852
      alert.action: allowed
      firewall.policy: accept:flow,alert
      pcap_cnt: 1
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 853
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 1003
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 1004
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: accept
      flow.alerted: true
