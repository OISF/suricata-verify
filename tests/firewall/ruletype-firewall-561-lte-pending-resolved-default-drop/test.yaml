%YAML 1.1
---
requires:
  min-version: 9
args:
  - --simulate-ips
  - -k none
pcap: input.pcap
checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2201001
        firewall.hook: http:request_headers
        firewall.policy: drop:flow,alert
  - filter:
      count: 1
      match:
        event_type: flow
        flow.action: drop
        flow.alerted: true
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 211
