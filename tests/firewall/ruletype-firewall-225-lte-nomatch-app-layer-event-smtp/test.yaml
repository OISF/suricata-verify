requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

pcap: ../../smtp-attachment-md5/input.pcap

checks:
# the bare < rule covers request_started, so no default app policy drop may happen
# in the to_server direction
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
      direction: to_server
# the no-match drop candidate never matched, so nothing is dropped by the rules
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall rules"
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 210
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 211
      alert.action: allowed
      firewall.hook: smtp:request_complete
      firewall.policy: accept:flow,alert
      pcap_cnt: 17
- filter:
    count: 4
    match:
      event_type: alert
      alert.signature_id: 1004
      alert.action: allowed
      firewall.hook: smtp:response_started
      firewall.policy: accept:hook,alert
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 1005
      alert.action: allowed
      firewall.hook: smtp:response_data
      firewall.policy: accept:hook,alert
      pcap_cnt: 14
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 1006
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: accept
      flow.alerted: true
