%YAML 1.1
---

vars:
  address-groups:
    HOME_NET: "[10.0.0.0/8]"
    EXTERNAL_NET: "!$HOME_NET"

stats:
  enabled: yes
  interval: 8

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - stats
        - flow
        - alert
        - drop:
            alerts: yes
            flows: all

firewall:
  policies:
    # accept the session packets without per-test boilerplate rules
    packet:
      default-policy: ["accept:hook"]
    # drop and alert on the app states no rule covers, for the richer logging
    app:
      tls:
        default-policy: ["drop:flow", "alert"]
      http1:
        default-policy: ["drop:flow", "alert"]
      http2:
        # accept every state this test does not exercise, so that the trailer
        # state override below is what decides the flow
        default-policy: ["accept:hook"]
        # overrides the state default for the trailer states only
        stream:
          request-trailers: ["accept:flow"]
          response-trailers: ["accept:flow"]
