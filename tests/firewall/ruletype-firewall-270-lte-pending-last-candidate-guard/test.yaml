requires:
  min-version: 9
args:
- --simulate-ips
- -k none
pcap: ../lte-matrix-data/http1.pcap
checks:
- filter:
    count: 1
    match:
      event_type: drop
      drop.reason: firewall default app policy
      pcap_cnt: 10
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 2201001
      pcap_cnt: 10
      alert.action: blocked
      firewall.hook: http:request_headers
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 100
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 200
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: drop
      flow.alerted: true
