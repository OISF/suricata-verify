requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

pcap: ../../tls/tls-client-hello-frag-01/dump_mtu300.pcap

checks:
# the < rule does not actually match, so the uncovered to_client states must be dropped
# by the default app policy
- filter:
    count: 1
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
      direction: to_client
# no explicit drop rule exists in this ruleset
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall rules"
- filter:
    count: 2
    match:
      event_type: alert
      alert.signature_id: 701
      alert.action: allowed
      firewall.hook: tls:client_started
      firewall.policy: accept:hook,alert
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 702
      alert.action: allowed
      firewall.hook: tls:client_hello
      firewall.policy: accept:hook,alert
      pcap_cnt: 6
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 703
      alert.action: allowed
      firewall.hook: tls:client_cert
      firewall.policy: accept:hook,alert
      pcap_cnt: 6
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 704
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 705
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 611
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: drop
      flow.alerted: true
