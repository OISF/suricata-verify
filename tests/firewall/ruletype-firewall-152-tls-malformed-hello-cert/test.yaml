# A TLS session whose ClientHello is truncated (too short for the
# random field) and whose server certificate carries a garbage DER
# body: both messages fail to decode. A decode failure must not enter
# the phase state - the phase data (SNI, certificates) does not exist
# for a message that failed to parse - but the message bytes are
# consumed and parsing continues: the flow is neither dropped nor
# blinded, and the next message that decodes cleanly still advances:
# - the client_hello rule (sid 1520) never fires: the truncated hello
#   leaves the client track in client_started;
# - the server_hello rule (sid 1521) fires twice: the valid ServerHello
#   decodes after the failed ClientHello (the suppression applies to
#   the failed message only) and the state rule is evaluated on the
#   ServerHello record and on the following certificate record;
# - the server_cert rule (sid 1522) never fires: the malformed
#   certificate leaves the server track in server_hello.
# The decode failures are visible in the anomaly events
# (HANDSHAKE_INVALID_LENGTH on the truncated hello, INVALID_CERTIFICATE
# on the garbage certificate).
# The pcap is crafted by craft-pcap.py (see that file).
requires:
  min-version: 9

pcap: input.pcap

args:
  - --simulate-ips
  - -k none

checks:
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 1520
- filter:
    count: 2
    match:
      event_type: alert
      alert.signature_id: 1521
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 1522
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 1525
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 1526
- filter:
    count: 1
    match:
      event_type: anomaly
      anomaly.event: HANDSHAKE_INVALID_LENGTH
      anomaly.app_proto: tls
- filter:
    count: 1
    match:
      event_type: anomaly
      anomaly.event: INVALID_CERTIFICATE
      anomaly.app_proto: tls
# no drop at all: the decode failures suppress the phase advance of
# their own messages only, they are not an app-layer error
- filter:
    count: 0
    match:
      event_type: flow
      flow.action: drop
- filter:
    count: 1
    match:
      event_type: stats
      stats.firewall.accepted: 7
      stats.firewall.blocked: 0
      stats.firewall.drop_reason.rules: 0
      stats.firewall.drop_reason.default_app_policy: 0
