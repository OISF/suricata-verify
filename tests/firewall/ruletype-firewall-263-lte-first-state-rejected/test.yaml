# An LTE (<hook) rule at the protocol's first state (progress 0) provides no
# prior-state coverage and is rejected at load, which is fatal under
# --init-errors-fatal (how the framework runs suricata).
requires:
  min-version: 9

pcap: false

args:
  - -T

exit-code: 1

checks:
- shell:
    args: grep -c 'cannot be used at the first state' stderr
    expect: 1
