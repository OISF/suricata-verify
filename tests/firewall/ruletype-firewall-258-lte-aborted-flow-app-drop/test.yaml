requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

pcap: input.pcap

checks:
- filter:
    count: 1
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 100
      alert.action: allowed
      firewall.hook: http:request_headers
      firewall.policy: accept:flow,alert
      pcap_cnt: 6
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: drop
      flow.alerted: false
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: accept
      flow.alerted: true
