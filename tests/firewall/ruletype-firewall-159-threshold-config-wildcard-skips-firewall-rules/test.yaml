requires:
  min-version: 9

pcap: ../../flowbit-oring/input.pcap

args:
  - --simulate-ips
  - -k none
  - --set threshold-file=threshold.config

checks:
# Both threat detection rules are covered by the wildcard.
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 100001
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 100002

# The firewall rule was skipped by the wildcard, so it still alerts.
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 103

# One summary warning, not one per firewall rule.
- shell:
    args: grep "firewall rules can't be thresholded" stdout | wc -l
    expect: 1
