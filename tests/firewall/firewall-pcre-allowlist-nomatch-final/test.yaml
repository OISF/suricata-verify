%YAML 1.1
---
# The bound of the deferral: the same split headers, but the allow-list rule's pattern is
# absent from the traffic. Its miss is not final while the header block is incomplete, and it
# becomes final on the packet that completes it - so the hook's default policy decides there.
# An unconditional "not final" would keep this fixture's checks green in the other file while
# the default silently stopped firing; here it fails.
requires:
  min-version: 9
args:
  - --simulate-ips
  - -k none
pcap: input.pcap
checks:
  - filter:
      comment: "the miss becomes final when the header block completes"
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2201001
        firewall.hook: http:request_headers
        pcap_cnt: 6
  - filter:
      comment: "the flow is dropped by that default"
      count: 1
      match:
        event_type: flow
        flow.action: drop
  - filter:
      comment: "the allow-list rule never matches"
      count: 0
      match:
        event_type: alert
        alert.signature_id: 102
