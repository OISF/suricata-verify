requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

pcap: ../../ftp-port-memcap/input.pcap

checks:
# request_started is auto-accepted while the < rule is pending (its partial match acts as an accept:hook for the prior states), so no
# default app policy drop may happen for it
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
      direction: to_server
# no explicit drop rule exists in this ruleset
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall rules"
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 210
      alert.action: allowed
      firewall.policy: accept:flow,alert
      pcap_cnt: 5
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 211
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 1003
      alert.action: allowed
      firewall.policy: accept:hook,alert
      pcap_cnt: 4
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 1004
      alert.action: allowed
      firewall.policy: accept:hook,alert
      pcap_cnt: 4
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: accept
      flow.alerted: true
