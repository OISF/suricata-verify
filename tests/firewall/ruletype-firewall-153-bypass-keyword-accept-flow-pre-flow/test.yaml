requires:
  min-version: 9

pcap: ../../flowbit-oring/input.pcap

args:
  - --simulate-ips
  - -k none

checks:
  - filter:
      # we should get one alert for this
      count: 2
      match:
        event_type: alert
        pcap_cnt: 1
        alert.signature_id: 1000
#        verdict.action: accept
  - filter:
      # represents current behavior
      count: 0
      match:
        event_type: alert
        alert.signature_id: 100001
  - filter:
      count: 1
      match:
        event_type: flow
        flow.state: bypassed
        flow.bypass: local
  - filter:
      # represents current behavior
      count: 1
      match:
        event_type: stats
        stats.ips.blocked: 0
        stats.ips.accepted: 9
        stats.firewall.accepted: 10
        stats.flow.end.state.local_bypassed: 1
        stats.flow_bypassed.local_pkts: 9


