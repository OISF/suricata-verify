requires:
  min-version: 9
args:
- --simulate-ips
- -k none
pcap: ../../ntp-keywords/input.pcap
checks:
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 100
- filter:
    count: 1
    match:
      event_type: drop
      drop.reason: firewall default app policy
      pcap_cnt: 1
      direction: to_server
- filter:
    count: 1
    match:
      event_type: drop
      drop.reason: firewall default app policy
      pcap_cnt: 3
      direction: to_server
- filter:
    count: 2
    match:
      event_type: flow
      flow.action: drop
      flow.alerted: true
