%YAML 1.1
---
requires:
  min-version: 9
args:
  - --simulate-ips
  - -k none
pcap: input.pcap
checks:
  - filter:
      count: 0
      match:
        event_type: drop
        drop.reason: firewall default app policy
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 212
        alert.action: allowed
        firewall.hook: http:request_headers
        firewall.policy: accept:flow,alert
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 211
  - filter:
      count: 1
      match:
        event_type: flow
        flow.action: accept
        flow.alerted: true
