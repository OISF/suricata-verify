# A TLS session whose server Certificate message carries a garbage
# DER body (not an ASN.1 SEQUENCE). The ClientHello, the ServerHello
# and a valid client Certificate are all complete and decode cleanly,
# so the client track reaches the client_cert phase and the server
# track reaches the server_hello phase. The malformed server
# certificate must fail to decode without entering the server_cert
# phase - the certificate phase data does not exist for a message
# that failed to parse:
# - sid 1532 (server_cert) never fires: the server track stays in
#   server_hello;
# - the failure is not an app-layer error: the message bytes are
#   consumed, the rest of the flow is parsed, and nothing is dropped
#   - every phase state the session enters carries an explicit
#   accept rule (see firewall.rules), so no implicit default app
#   policy drop either.
#
# The certificate failure is visible in the anomaly events
# (INVALID_CERTIFICATE, INVALID_HANDSHAKE_MESSAGE) at the malformed
# record (pcap_cnt 7).
#
# The pcap is crafted by craft-pcap.py (see that file); the client
# certificate body is the committed client_cert.der (a self-signed
# X.509 certificate).
requires:
  min-version: 9

pcap: input.pcap

args:
  - --simulate-ips
  - -k none

checks:
# the client and server hello phases are entered by the valid hellos
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 1534
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 1530
      ts_progress: client_hello
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 1535
# the valid client certificate enters the client_cert phase
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 1533
      ts_progress: client_cert
# the malformed server certificate never enters the server_cert phase
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 1532
# the certificate failure is flagged once on the malformed record
- filter:
    count: 1
    match:
      event_type: anomaly
      anomaly.event: INVALID_CERTIFICATE
      anomaly.app_proto: tls
      pcap_cnt: 7
# (one event: the decode fails at the first certificate and the
# decode error is reported once)
# the server_hello state rule is evaluated on the ServerHello record
# and on the malformed certificate record (still in server_hello)
- filter:
    count: 2
    match:
      event_type: alert
      alert.signature_id: 1531
# no drop at all: the decode failure suppresses the phase advance of
# its own message only, it is not an app-layer error
- filter:
    count: 0
    match:
      event_type: flow
      flow.action: drop
# no packet or app state was dropped by rules or by the implicit
# default app policy
- filter:
    count: 1
    match:
      event_type: stats
      stats.firewall.accepted: 8
      stats.firewall.blocked: 0
      stats.firewall.drop_reason.rules: 0
      stats.firewall.drop_reason.default_app_policy: 0
