requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

pcap: ../../tls/tls-client-hello-frag-01/dump_mtu300.pcap

checks:
# the < rule covers the no-match state, so no default app policy drop in the to_server direction
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
      direction: to_server
# the drop rule itself never matched, so nothing is dropped by the rules
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall rules"
