requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

pcap: ../../tls/tls-client-hello-frag-01/dump_mtu300.pcap

checks:
# the < rule does not actually match, so the state must be dropped by the default app policy
- filter:
    count: 1
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
      direction: to_server
# the drop rule itself never fully matched, so nothing is dropped by the rules
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: "firewall rules"
