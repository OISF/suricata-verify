requires:
  min-version: 9
args:
- --simulate-ips
- -k none
pcap: ../ruletype-firewall-17-http-txbits-multi-tx/http-sticky-server-s8.pcap
checks:
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 100
      pcap_cnt: 4
      alert.action: allowed
      firewall.hook: http:request_body
- filter:
    count: 0
    match:
      event_type: drop
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: accept
      flow.alerted: true
