requires:
  min-version: 9
args:
- --simulate-ips
- -k none
pcap: ../../tls/tls-client-hello-frag-01/dump_mtu300.pcap
checks:
- filter:
    count: 1
    match:
      event_type: drop
      drop.reason: firewall default app policy
      pcap_cnt: 62
      direction: to_server
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 2201001
      pcap_cnt: 62
      alert.action: blocked
      firewall.policy: drop:flow,alert
      firewall.hook: tls:client_data
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: drop
      flow.alerted: true
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: firewall rules
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 100
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 101
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 102
