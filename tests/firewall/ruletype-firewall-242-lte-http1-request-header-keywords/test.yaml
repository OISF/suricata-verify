requires:
  min-version: 9

args:
  - --simulate-ips
  - -k none

pcap: input.pcap

checks:
- filter:
    count: 6
    match:
      event_type: drop
      drop.reason: "firewall default app policy"
- filter:
    count: 6
    match:
      event_type: alert
      alert.signature_id: 211
      alert.action: allowed
      firewall.hook: http:request_headers
      firewall.policy: accept:flow,alert
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 212
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 213
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 214
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 215
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 216
- filter:
    count: 6
    match:
      event_type: flow
      flow.action: drop
      flow.alerted: false
- filter:
    count: 6
    match:
      event_type: flow
      flow.action: accept
      flow.alerted: true
