requires:
  min-version: 9

pcap: input.pcap

args:
  - --simulate-ips
  - -k none
  - --set app-layer.protocols.imap.enabled=yes

checks:
  - filter:
      count: 0
      match:
        event_type: drop
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 3
        pcap_cnt: 4
        direction: to_client
        tx_id: 0
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 4
        pcap_cnt: 4
        direction: to_client
        tx_id: 0
        ts_progress: request_complete
        tc_progress: response_complete
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        pcap_cnt: 5
        direction: to_server
        tx_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
        pcap_cnt: 5
        direction: to_server
        tx_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 3
        pcap_cnt: 6
        direction: to_client
        tx_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 4
        pcap_cnt: 7
        direction: to_client
        tx_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 3
        pcap_cnt: 7
        direction: to_client
        tx_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      count: 3
      match:
        event_type: alert
        alert.signature_id: 3
  - filter:
      count: 2
      match:
        event_type: alert
        alert.signature_id: 4
  - filter:
      count: 1
      match:
        event_type: stats
        stats.firewall.blocked: 0
