requires:
  min-version: 9
args:
- --simulate-ips
- -k none
pcap: ../../http2-bugfixes/input.pcap
checks:
- filter:
    count: 1
    match:
      event_type: drop
      drop.reason: firewall default app policy
      pcap_cnt: 8
      direction: to_client
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 2201001
      pcap_cnt: 8
      alert.action: blocked
      firewall.policy: drop:flow,alert
      firewall.hook: http2:stream:response_headers
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: drop
      flow.alerted: true
- filter:
    count: 0
    match:
      event_type: drop
      drop.reason: firewall rules
- filter:
    count: 0
    match:
      event_type: alert
      alert.signature_id: 100
