# A ClientHello fragmented across two TLS records must not advance the
# phase state until the handshake message is fully buffered: the
# client_hello decision is made only when the SNI is available. Pins:
# - the client_started rule (sid 1511) fires at the hello transition
#   (the transition now happens on the final fragment);
# - the client_hello sni rule (sid 1512) matches and accepts the flow -
#   without the buffered transition the decision would be made on the
#   first fragment, the sni buffer would be empty, the implicit default
#   app policy (drop) would apply, and the flow would be dropped before
#   the SNI is ever parsed;
# - all packets are accepted in transit (no blocks).
# The pcap is crafted by craft-pcap.py (see that file).
requires:
  min-version: 9

pcap: input.pcap

args:
  - --simulate-ips
  - -k none

checks:
- filter:
    count: 1
    match:
      event_type: alert
      alert.signature_id: 1512
      ts_progress: client_hello
- filter:
    count: 1
    match:
      event_type: flow
      flow.action: accept
      app_proto: tls
- filter:
    count: 1
    match:
      event_type: stats
      stats.firewall.accepted: 6
      stats.firewall.blocked: 0
