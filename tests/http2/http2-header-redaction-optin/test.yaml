pcap: ../http2-header-redaction/http2.pcap

requires:
  min-version: 9

args:
  - -k none

checks:
  - filter:
      count: 1
      match:
        event_type: http
        http.url: /redact
        http.request_headers[2].name: cookie
        http.request_headers[2].value: session=secret123
        http.request_headers[3].name: authorization
        http.request_headers[3].value: Bearer tok123
        not-has-key:
          - http.request_headers[2].redacted
          - http.request_headers[3].redacted
