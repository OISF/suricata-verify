# Transfer command hidden behind an oversized command in the same slice; the
# hidden RETR must still reach the data-channel negotiation. See README.md.

requires:
  min-version: 9

args:
- -k none --set app-layer.protocols.ftp.max-line-length=32

checks:
  - filter:
      count: 4
      match:
        event_type: ftp

  - filter:
      count: 1
      match:
        event_type: ftp
        ftp.command: USER
        ftp.command_data: "AAAAAAAAAAAAAAAAAAAAAAAAAAA"
        ftp.command_truncated: true

  # The RETR behind the oversized command is still parsed.
  - filter:
      count: 1
      match:
        event_type: ftp
        ftp.command: RETR
        ftp.command_data: secret.txt

  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.event: request_command_too_long

  # The hidden RETR reached the data-channel negotiation: with no PORT
  # negotiated, the transfer-command handling -- the same block that would
  # register the ftp-data expectation -- raises file_before_port.
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.event: file_before_port
