# Request split-slice: a complete line, then an unterminated oversized line
# whose tail (a would-be QUIT) lands in the next slice. See README.md.

requires:
  min-version: 9

args:
- -k none --set app-layer.protocols.ftp.max-line-length=32

checks:
  - filter:
      count: 2
      match:
        event_type: ftp

  # The oversized USER line is reported truncated.
  - filter:
      count: 1
      match:
        event_type: ftp
        ftp.command: USER
        ftp.command_truncated: true

  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.event: request_command_too_long

  # No phantom QUIT: the "QUIT" is the tail of the oversized line, not a command.
  - filter:
      count: 0
      match:
        event_type: ftp
        ftp.command: QUIT
