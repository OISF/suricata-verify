# The remainder of an oversized reply, followed by a real reply in the same
# slice. See README.md.

requires:
  min-version: 9

args:
- -k none --set app-layer.protocols.ftp.max-line-length=32

checks:
  - filter:
      count: 4
      match:
        event_type: ftp

  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.event: response_command_too_long

  # The oversized reply is reported truncated on the USER transaction.
  - filter:
      count: 1
      match:
        event_type: ftp
        ftp.command: USER
        ftp.reply_truncated: true

  # The reply behind the remainder reaches the pending PWD transaction.
  - filter:
      count: 1
      match:
        event_type: ftp
        ftp.command: PWD
        ftp.completion_code: ["226"]

  # The 221 stays with QUIT rather than being pulled forward.
  - filter:
      count: 1
      match:
        event_type: ftp
        ftp.command: QUIT
        ftp.completion_code: ["221"]
