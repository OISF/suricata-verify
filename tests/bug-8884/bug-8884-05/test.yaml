# Over-long reply on a response path that jumps to tx_complete; the reply behind
# it must still survive. See README.md.

requires:
  min-version: 8.0.7

args:
- -k none --set app-layer.protocols.ftp.max-line-length=32

checks:
  - filter:
      count: 4
      match:
        event_type: ftp

  # The 331 reply to USER, in the slice after the oversized 500, still lands on
  # the USER transaction.
  - filter:
      count: 1
      match:
        event_type: ftp
        ftp.command: USER
        ftp.completion_code: ["331"]
        ftp.reply: ["need password"]

  # And the 221 is not misattributed to USER: it stays with QUIT.
  - filter:
      count: 1
      match:
        event_type: ftp
        ftp.command: QUIT
        ftp.completion_code: ["221"]
        ftp.reply: ["bye"]
