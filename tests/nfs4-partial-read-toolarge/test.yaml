%YAML 1.1
---
# A partial (incomplete) NFSv4 compound reply: after a small READ request and
# response complete normally, the second reply's RPC fragment claims a
# ~4.2 KiB record but only ~204 bytes of the compound are present: a leading
# PUTFH response followed by the READ response claiming a 4096-byte data
# blob. Before the fix the partial-record path only special-cased NFSv3 READ
# replies (and the v4 scan mis-fed leading ops to the command parser), so
# the reply was buffered toward the claimed (up to 31-bit RPC length) record
# size without ever running the size limit. After the fix the reply compound
# is scanned -- leading ops parsed with their regular parsers -- up to the
# READ op's claimed length and the reply is rejected mid-flow.

requires:
  min-version: 8.0.7

pcap: input.pcap
args:
  - --set app-layer.protocols.nfs.max-read-size=1024

checks:
  - shell:
      args: test "$(grep -Ec 'read_response_too_large' eve.json)" -ge 1
  - shell:
      args: test "$(grep -Ec 'malformed_data' eve.json)" -eq 0
  - shell:
      args: test "$(grep -Ec 'too_many_transactions' eve.json)" -eq 0
  # the rejected READ response is logged mid-flow (pcap_cnt present) with the
  # file transaction completed, not left open
  - filter:
      count: 1
      match:
        event_type: nfs
        nfs.procedure: READ
        nfs.file_tx: true
        pcap_cnt: 11
  - filter:
      count: 1
      match:
        event_type: flow
        app_proto: nfs
