requires:
  min-version: 8.0.8

pcap: ../../tcp-urgp-07-oob-exceed-limit/tcp-urgent-1byte-66k.pcap
rules: ../../tcp-urgp-07-oob-exceed-limit/suricata.rules

args:
- --runmode single
- --simulate-ips
- --set stats.interval=3600

checks:
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 1000001
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1000002
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 1000003
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2210066
  - filter:
      count: 1
      match:
        event_type: http
        http.url: "/malicious"
  - filter:
      count: 1
      match:
        event_type: stats
        stats.ips.accepted: 131549
        stats.ips.blocked: 465
        stats.ips.drop_reason.stream_urgent: 465
        stats.tcp.urg: 66000
        stats.tcp.reassembly_gap: 1
