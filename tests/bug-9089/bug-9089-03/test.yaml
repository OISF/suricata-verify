# byte_extract with string and 0 bytes converts only the digits inside the
# buffer. See README.md.

requires:
  min-version: 9

pcap: ../bug-9089-01/input.pcap

args:
  - -k none

checks:
  # every rule loads; a missing alert means no match.
  - filter:
      count: 1
      match:
        event_type: stats
        stats.detect.engines[0].rules_loaded: 3
        stats.detect.engines[0].rules_failed: 0
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 3
