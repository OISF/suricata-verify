%YAML 1.1
---
requires:
  min-version: 9

args:
  # checksums are not computed in the pcap
  - -k none

pcap: input.pcap

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 10
  # the cap drops this occurrence, so the rule must stay silent
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 3
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 4
  # the second occurrence of the trailer name raises the same anomaly as a
  # repeated header field, once, however many repeats follow
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.app_proto: http
        anomaly.event: REQUEST_HEADER_REPETITION
        anomaly.type: applayer
