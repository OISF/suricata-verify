%YAML 1.1
---
requires:
  min-version: 9

args:
  # checksums are not computed in the pcap
  - -k none

pcap: input.pcap

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 10
  # the cap drops this occurrence, so the rule must stay silent
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 3
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 4
