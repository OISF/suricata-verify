%YAML 1.1
---

stats:
  enabled: yes
  interval: 8

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - anomaly
        - files:
            force-hash: [sha256]
        - flow
        - stats:
            totals: yes
            threads: no
            deltas: no
