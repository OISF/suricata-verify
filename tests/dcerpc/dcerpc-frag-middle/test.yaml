requires:
  min-version: 9

pcap: input.pcap

args:
- -k none

checks:
  # all three fragments of each side land on a single transaction
  - filter:
      count: 1
      match:
        event_type: dcerpc
        dcerpc.request: REQUEST
  - filter:
      count: 1
      match:
        event_type: dcerpc
        dcerpc.request: REQUEST
        dcerpc.call_id: 2
        dcerpc.req.frag_cnt: 3
        dcerpc.req.stub_data_size: 24
        dcerpc.res.frag_cnt: 3
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
  # regression guard: the middle fragment must not complete the transaction
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 2
