requires:
  min-version: 8.0.5

pcap: input.pcap

checks:
  # SID 1 uses a dummy interface UUID. A missing PFC_FIRST_FRAG flag should not cause a match.
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 1

  # SID 2 matches the real UUID. There are two connections with opnum 42 in
  # the PCAP. Since Suricata 9 the BIND flags are not relevant for
  # dcerpc.iface, only the REQUEST flags are (Redmine #8577).
  - filter:
      requires:
        min-version: 9
      count: 2
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      requires:
        lt-version: 9
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
