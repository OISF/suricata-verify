requires:
  min-version: 9

args:
  - -k none
  - --set app-layer.protocols.imap.enabled=yes
  - --set stream.reassembly.depth=0

pcap: input.pcap

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.app_proto: imap
        anomaly.event: data_limit_reached
