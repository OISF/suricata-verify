requires:
  min-version: 9

args:
 - -k none

checks:
  # The failed client direction is logged with the failure reason; the
  # server direction parsed a valid banner and carries no error.
  - filter:
      count: 1
      match:
        event_type: ssh
        ssh.client.error: "invalid_banner"
        ssh.server.proto_version: "2.0"
        ssh.server.software_version: "TestServer_1.0"
        not-has-key:
          - ssh.client.proto_version
          - ssh.server.error
