requires:
  min-version: 9

args:
- -k none
- --set stream.midstream=true
- --set app-layer.protocols.nfs.enabled=yes

pcap: input.pcap

checks:
  # the v4 COMPOUND READ request carries RPCSEC_GSS credentials with
  # service rpc_gss_svc_none (procedure 0, service 1), recorded in the
  # xidmap. Its reply arrives segmented, claiming an 8 KiB record
  # (below max-read-size) while the enclosed compound carries a READ
  # claiming 17 MiB (above the 16 MiB default). The reply-side partial
  # scan must treat the raw compound as the scan data (no envelope for
  # service none) and reject the claim; before the service-none fix the
  # (0, 1) combination hit the scanner's catch-all and the reply was
  # discarded as malformed instead (Redmine #8791 class)
  - shell:
      args: test "$(grep -Ec 'read_response_too_large' eve.json)" -ge 1
  # no malformed-data anomaly: the rejection is the size reject, not a
  # scanner catch-all
  - shell:
      args: test "$(grep -Ec '"event":"malformed_data"' eve.json)" -eq 0
