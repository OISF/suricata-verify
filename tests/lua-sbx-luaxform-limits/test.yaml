requires:
  features:
    - HAVE_LUA
  min-version: 8.0.8

pcap: ../lua-output-http/input.pcap

args:
  - --set security.lua.allow-rules=true

checks:
  # The transform loops forever; the instruction limit must trip and the
  # failure must be counted in transform.lua.instruction_limit_errors.
  - stats:
      transform.lua.instruction_limit_errors: 1
  - filter:
      count: 1
      match:
        alert.signature_id: 1
