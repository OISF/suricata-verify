requires:
  min-version: 9
args:
  - -k none
  - --set app-layer.protocols.imap.enabled=yes
  - --set app-layer.protocols.imap.max-responses=3
pcap: input.pcap

checks:
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A1 UID FETCH 1:* (FLAGS)
        imap.responses.__len: 4
        imap.responses[2]: "* 3 FETCH (UID 3 FLAGS ())"
        imap.responses[3]: A1 OK UID FETCH completed
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A2 NOOP
        imap.responses.__len: 4
        imap.responses[3]: A2 OK NOOP completed
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A3 NOOP
        imap.responses[0]: A3 OK NOOP completed
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.app_proto: imap
        anomaly.event: too_many_responses
  - filter:
      count: 1
      match:
        event_type: anomaly
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        tx_id: 1
  - stats:
      app_layer.error.imap.parser: 0
