requires:
    min-version: 9
    pcap: false
    lambda: sys.platform != "win32"

args:
    - --list-keywords=json

checks:
- filter:
    filename: stdout
    count: 1
    match:
      dnp3_func.enum_values.confirm: 0
      dnp3_func.features[0]: "enum uint"
      snmp__dot__pdu_type.enum_values.get_request: 0