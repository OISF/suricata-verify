requires:
  min-version: 9
args:
  - -k none
  - --set app-layer.protocols.imap.enabled=yes
pcap: input.pcap

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 101
        flow.src_port: 42010
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 102
        flow.src_port: 42010
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 201
        flow.src_port: 42020
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 202
        flow.src_port: 42020
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 203
        flow.src_port: 42020
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A1 FETCH 1:* BODY[]
        imap.responses[0]: '* 1 FETCH (BODY[] {217})'
        imap.responses[1]: '* 2 FETCH (BODY[] {222})'
        imap.responses[2]: A1 OK FETCH completed
        src_port: 42030
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 301
        flow.src_port: 42030
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 302
        flow.src_port: 42030
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 303
        flow.src_port: 42030
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 1
  - stats:
      app_layer.error.imap.parser: 0
