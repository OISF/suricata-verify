requires:
  min-version: 9

pcap: ../ssh-ips-drop-flush/input.pcap

args:
  - --simulate-ips
  - -k none

checks:
  # The flow is dropped at the pre-stream hook after the banners were parsed
  # but before either side sends NewKeys. The ssh record must still be emitted:
  # the drop schedules the pending tx loggers once, and the output stage of the
  # dropping packet runs them.
  - filter:
      count: 1
      match:
        event_type: ssh
        ssh.client.proto_version: "2.0"
        ssh.client.software_version: "OpenSSH_for_Windows_7.7"
        ssh.server.proto_version: "2.0"
        ssh.server.software_version: "OpenSSH_7.4"
  # the pre-stream rule matches on the first two bare ACKs after the banner
  - filter:
      count: 2
      match:
        event_type: alert
        alert.signature_id: 2
        alert.action: blocked
  - filter:
      count: 1
      match:
        event_type: flow
        app_proto: ssh
        flow.action: drop
