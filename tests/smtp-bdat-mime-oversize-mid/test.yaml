requires:
  min-version: 9

pcap: input.pcap

args:
  - -k none
  - --set app-layer.protocols.smtp.max-bdat-chunk-len=1000

checks:
  # chunks of 800, 4200 (over the limit, skipped) and 842 LAST octets: the
  # attachment misses the middle chunk, so it cannot close as complete
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.event: BDAT_MAX_CHUNK_LEN_EXCEEDED
  - filter:
      count: 1
      match:
        event_type: fileinfo
        fileinfo.filename: att.bin
        fileinfo.state: TRUNCATED
  # the line cut by chunk 1 must not be glued to the first line of chunk 3
  - filter:
      count: 0
      match:
        event_type: anomaly
        anomaly.event: MIME_LONG_ENC_LINE
