requires:
  min-version: 9

args:
  - -k none

checks:
  # The URI is inspected on the packet with the headers and the body on the
  # next packet. The value byte_extract stored stays in its slot, so the
  # body still decodes with the URI key.
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
