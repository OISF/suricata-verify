requires:
    min-version: 9

args:
- -k none

checks:
  # For a VLAN-tagged frame the ethernet unknown_ethertype event reports the
  # RARP value after the tag (0x8035 = 32821), while ether.ether_type is the
  # ethernet header's type, the VLAN tag ethertype (0x8100 = 33024).
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.type: decode
        anomaly.event: decoder.ethernet.unknown_ethertype
        unknown_ether_type: 32821
        ether.ether_type: 33024
  # The VLAN unknown-type event is also raised, and its record carries
  # the same unknown_ether_type.
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.type: decode
        anomaly.event: decoder.vlan.unknown_type
        unknown_ether_type: 32821
  # The alert for the unknown ethertype event carries the value after the
  # VLAN tag, while ether.ether_type stays the VLAN tag ethertype.
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        unknown_ether_type: 32821
        ether.ether_type: 33024
  # A second alert on the same packet, from a rule on the VLAN event,
  # carries the field too: every alert for the packet has it.
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
        unknown_ether_type: 32821
  - filter:
      count: 2
      match:
        event_type: alert
        has-key: unknown_ether_type
