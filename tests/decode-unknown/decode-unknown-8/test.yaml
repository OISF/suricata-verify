requires:
    min-version: 9

args:
- -k none

checks:
  # The tunneled packet starts at a VLAN header, with no ethernet header.
  # Its ethernet unknown_ethertype event reports the RARP value after the
  # second VLAN tag (0x8035 = 32821).
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.type: decode
        anomaly.event: decoder.ethernet.unknown_ethertype
        unknown_ether_type: 32821
        vlan[0]: 10
        vlan[1]: 20
  # The VLAN unknown-type event is also raised, and its record carries
  # the same unknown_ether_type.
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.type: decode
        anomaly.event: decoder.vlan.unknown_type
        unknown_ether_type: 32821
  # The alert for the tunneled packet's event carries the value.
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        unknown_ether_type: 32821
  # The alert for the outer GRE packet, which has no such event, does not
  # carry the field.
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
        not-has-key: unknown_ether_type
