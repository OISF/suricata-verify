%YAML 1.1
---

# request-body-limit 0 disables the htp clip; stream.reassembly.depth 0
# lets the whole 5-MiB body reach the parser. The logger's own 100-KiB
# body cap must keep the record small and set the truncation marker.
stream:
  reassembly:
    depth: 0
    memcap: 128 MiB

app-layer:
  protocols:
    http:
      enabled: yes
      libhtp:
        default-config:
          request-body-limit: 0
          response-body-limit: 0
      tcp:
        enabled: yes
        detection-ports:
          dp: 80

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            metadata: yes
            http-body: yes
            http-body-printable: yes
            http-body-log-limit: 16 KiB
