requires:
  min-version: 9

args:
 - -k none --set default-rule-path=. --simulate-ips

checks:
  # Both banners parse. The client direction stays in kex (it never
  # sends a newkeys record): its banner and kex hooks open and the
  # session hook never does. The server direction reaches kex and
  # then fails on the invalid record: its kex hook opens, its
  # session hook never does, and the failure is logged.
  - filter:
      count: 1
      match:
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        alert.signature_id: 2
  - filter:
      count: 0
      match:
        alert.signature_id: 3
  - filter:
      count: 1
      match:
        alert.signature_id: 4
  - filter:
      count: 0
      match:
        alert.signature_id: 5
