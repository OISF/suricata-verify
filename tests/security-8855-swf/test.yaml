requires:
  min-version: 8.0.7

args:
  - --set app-layer.protocols.http.libhtp.default-config.swf-decompression.enabled=yes
  - --set app-layer.protocols.http.libhtp.default-config.swf-decompression.decompress-depth=0

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1 

  - filter:
      count: 1
      match:
        event_type: stats
        stats.app_layer.flow.http: 1
