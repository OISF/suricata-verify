requires:
  min-version: 9

pcap: input.pcap

args:
  - -k none

checks:
  # BDAT rejected before its octets arrive, then DATA on the same
  # transaction. Debug-validation builds must not abort; LSan must stay quiet.
  - filter:
      count: 1
      match:
        event_type: fileinfo
        fileinfo.filename: att.bin
        fileinfo.state: CLOSED
        fileinfo.size: 4096
