%YAML 1.1
---
requires:
  min-version: 9

args:
  # checksums are not computed in the pcap
  - -k none

pcap: input.pcap

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 3
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 4
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 5
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 10
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 11
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 12
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 20
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 21
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 22
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 23
