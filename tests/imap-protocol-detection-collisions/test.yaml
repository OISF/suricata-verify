requires:
  min-version: 9

args:
  - -k none
  - --set app-layer.protocols.imap.enabled=yes
  - --set app-layer.protocols.http.enabled=no
  - --set app-layer.protocols.ftp.enabled=detection-only

pcap: input.pcap

checks:
  - filter:
      count: 0
      match:
        event_type: flow
        src_port: 40000
        app_proto: imap
  - filter:
      count: 0
      match:
        event_type: flow
        src_port: 40001
        app_proto: imap
  - filter:
      count: 1
      match:
        event_type: flow
        src_port: 40001
        app_proto: ftp
  - filter:
      count: 1
      match:
        event_type: flow
        src_port: 40002
        app_proto: imap
  - filter:
      count: 1
      match:
        event_type: imap
        src_port: 40002
        imap.requests[0]: "A1 CAPABILITY"
