requires:
  min-version: 9

args:
  - -k
  - none
  - --simulate-ips

pcap: input.pcap

checks:
  # In IPS mode each segment is parsed as it arrives, so the request HEADERS
  # (pcap_cnt 5) are seen before the request DATA (pcap_cnt 6). The flow is
  # still HTTP/2 there (it turns DOH2 only once a DNS message parses), so this
  # is the window where a toclient DOH2 engine must keep the pair pending.
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        pcap_cnt: 10
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      count: 1
      match:
        event_type: dns
        dns.type: response
