requires:
  min-version: 9

pcap: input.pcap

args:
  - -k none

checks:
  # a chunk without LAST, then QUIT. QUIT ends the message the way "BDAT <n>
  # LAST" would (RFC 3030 4.3), so no anomaly here; the command that does not
  # drop the message is covered by tests/smtp-bdat-last-missing.
  - filter:
      count: 0
      match:
        event_type: anomaly
        anomaly.event: BDAT_LAST_MISSING
  - filter:
      count: 1
      match:
        event_type: fileinfo
        fileinfo.filename: att.bin
        fileinfo.state: TRUNCATED
        fileinfo.size: 1968
