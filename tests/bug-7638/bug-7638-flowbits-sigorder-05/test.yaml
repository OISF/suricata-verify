requires:
    min-version: 9

pcap: false

args:
  - --engine-analysis

# A diamond rather than a chain. sid:4 reads two bits that are produced at
# different depths:
#
#   sid:1 set A -> sid:2 isset A
#   sid:1 set A -> sid:4 isset A      (depth 1)
#   sid:2 set B -> sid:3 isset B
#   sid:3 set C -> sid:4 isset C      (depth 3)
#
# There is no cycle, so the ruleset must load. The expected diagnostic is the
# one about S: sid:1 checks it but no rule ever sets it.
checks:
  - shell:
      args: 'grep -c "flowbit ''S'' is checked but not set. Checked in 1 and 0 other sigs" suricata.log || true'
      expect: 1
