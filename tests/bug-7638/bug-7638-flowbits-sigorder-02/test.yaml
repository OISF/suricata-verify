requires:
    min-version: 9

pcap: false

args:
  - --engine-analysis

# Smallest possible deadlock, two rules that each need the other's bit:
#
#   sid:12 set headtest -> sid:10 isset headtest
#   sid:10 set moz      -> sid:12 isset moz
#
# Both edges are set edges, so they carry the same weight and cycle resolution
# has no lower priority edge it could drop.
#
# Before the engine starts, one error names the signatures in the cycle and
# one says the dependencies could not be resolved. The rest of the resolver's
# details are only logged at debug level.

checks:
  - filter:
      count: 1
      match:
        event_type: engine
        log_level: Error
        engine.message: "Cyclic dependency found between flowbits from signatures: [10, 12]"
  - filter:
      count: 1
      match:
        event_type: engine
        log_level: Error
        engine.message: "Error resolving flowbit dependencies"
