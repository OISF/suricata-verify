  # 40104: pad 1, (c) continuation ends on the last data byte
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 9194001
        src_port: 2049
        dest_port: 40104
  - filter:
      count: 1
      match:
        event_type: alert
