requires:
  min-version: 8.0.8

args:
  - -k none
  - --runmode single

checks:
  # The parser stays in sync on every flow: no parser error and three NFS
  # transactions per flow (two READ file transactions and the LOOKUP).
  - stats:
      app_layer.flow.nfs_tcp: 28
      app_layer.tx.nfs_tcp: 84
      app_layer.error.nfs_tcp.parser: 0

  # No NFS anomaly (malformed_data) on any flow.
  - filter:
      count: 0
      match:
        event_type: anomaly
        anomaly.app_proto: nfs

  # Sanity: the marker reaches raw stream inspection on every flow.
  - filter:
      count: 28
      match:
        event_type: alert
        alert.signature_id: 9194003

  # The 32 byte MARK_FH file after the padded record is complete.
  - filter:
      count: 26
      match:
        event_type: fileinfo
        rpc.xid: 2442403842
        fileinfo.state: CLOSED
        fileinfo.size: 32
        fileinfo.sha256: da8f9d06f5829eed4f2d509ebbb20c84ce1c40a0d8e755e13677e53deb405a31

  # Per flow: the marker reply alert (9194001), the LOOKUP alert (9194002)
  # and the first file (xid 0x91941001): CLOSED with its exact size and
  # sha256, or TRUNCATED at flow end when the reply has eof=0.

  # 40100: pad 1, control: complete reply in one segment
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 9194001
        src_port: 2049
        dest_port: 40100
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 9194002
        src_port: 40100
        dest_port: 2049
  - filter:
      count: 1
      match:
        event_type: fileinfo
        src_port: 2049
        dest_port: 40100
        rpc.xid: 2442399745
        fileinfo.state: CLOSED
        fileinfo.size: 515
        fileinfo.sha256: 5a76aa04b9e9070d486123aa4256225decbc87e81140026ead23a6d7b842b80c

  # 40101: pad 1, (a) first delivery ends on the last data byte
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 9194001
        src_port: 2049
        dest_port: 40101
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 9194002
        src_port: 40101
        dest_port: 2049
  - filter:
