requires:
  min-version: 9
args:
  - -k none
  - --set app-layer.protocols.imap.enabled=yes
pcap: input.pcap

checks:
  - filter:
      count: 3
      match:
        event_type: imap
  # Lines past the budget are dropped, but not the reply completing the
  # command.
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A1 FETCH 1:140 (ENVELOPE)
        imap.responses.__len.__lt: 540
        imap.responses[0].__startswith: "* 1 FETCH (ENVELOPE ("
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 3
  # A command sent while another transaction holds the whole budget keeps
  # its command line.
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A2 SEARCH TEXT hello
        imap.responses[0]: "* SEARCH 4 7"
        imap.responses[1]: A2 OK SEARCH completed
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.event: data_limit_reached
  - filter:
      count: 1
      match:
        event_type: anomaly
  - stats:
      app_layer.error.imap.parser: 0
