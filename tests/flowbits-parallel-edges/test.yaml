requires:
    min-version: 9

pcap: false

args:
  - --engine-analysis

# sid:1 and sid:2 are joined by three dependencies, two of them running the
# same way between the same pair of rules:
#
#   sid:1 set x   -> sid:2 isset x        (set edge)
#   sid:1 unset y -> sid:2 isnotset y     (unset edge)
#   sid:2 set z   -> sid:1 isset z        (set edge)
#
# The first two are parallel edges. With both kept, dropping the unset edge
# still leaves a set/set cycle of uniform weight, which cannot be broken.
#
# Before the engine starts, one error names the signatures in the cycle and
# one says the dependencies could not be resolved. The rest of the resolver's
# details are only logged at debug level.

checks:
  - filter:
      count: 1
      match:
        event_type: engine
        log_level: Error
        engine.message: "Cyclic dependency found between flowbits from signatures: [1, 2]"
  - filter:
      count: 1
      match:
        event_type: engine
        log_level: Error
        engine.message: "Error resolving flowbit dependencies"
