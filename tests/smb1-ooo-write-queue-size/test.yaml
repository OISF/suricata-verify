args:
  # the synthetic capture carries zeroed checksums
  - -k
  - none

requires:
  min-version: 9

pcap: input.pcap

checks:
  # the write queue byte limit (max-write-queue-size 16384) is hit by the
  # third out-of-order WRITE_ANDX (16384 + 8192 > 16384): the event is
  # attached to the affected file transaction
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.app_proto: smb
        anomaly.event: write_queue_size_exceeded
        tx_id: 4
  # the record after the rejected one is parsed and applied: the stored
  # file holds the in-order writes only (8192 x 0x41 + 8192 x 0x45), so
  # the stream stayed in sync
  - filter:
      count: 1
      match:
        event_type: fileinfo
        fileinfo.sha256: "28a2421345720a89f934f31c391b14a6d89aba06724469f4d2dc49a777a52203"
        fileinfo.stored: true
  - filter:
      count: 1
      match:
        event_type: smb
        smb.command: SMB1_COMMAND_WRITE_ANDX
  - shell:
      args: test "$(grep -Ec 'malformed' eve.json)" -eq 0
  - shell:
      args: test "$(grep -Ec 'truncated_file_data' eve.json)" -eq 0
