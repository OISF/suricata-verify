requires:
  features:
    - HAVE_LUA
  min-version: 8.0.8

pcap: input.pcap

checks:
  # control: reading the live tx each time must succeed (no false positive
  # from the liveness guard).
  - shell:
      args: test $(grep -c 'live read ok' stdout) -ge 1 && echo 1 || echo 0
      expect: "1"
  - shell:
      args: test $(grep -c 'live read unexpectedly failed' stdout) -eq 0 && echo 1 || echo 0
      expect: "1"
