- filter:
    requires:
      lt-version: 9
    count: 1
    match:
      event_type: alert
      app_proto: nfs
- filter:
    requires:
      min-version: 9
    # the test's own sid 1 (nfs_version:4, flow:to_server) matches one
    # response per newly tracked op: EXCHANGE_ID, CREATE_SESSION,
    # RECLAIM_COMPLETE, SECINFO_NO_NAME, LAYOUTGET, GETDEVINFO, WRITE, CLOSE,
    # DELEGRETURN, LAYOUTRETURN, DESTROY_SESSION, DESTROY_CLIENTID. A
    # PUTFH+GETATTR compound names no object, so it opens no tx (mainline).
    count: 12
    match:
      event_type: alert
      app_proto: nfs
# v4.1 backchannel: this capture has a server CB_NULL call to the client and the
# client's reply, which is normal traffic, so no anomaly may come out of it in
# either direction
- filter:
    count: 0
    match:
      event_type: anomaly
      anomaly.app_proto: nfs
      anomaly.event: response_to_server
- filter:
    count: 0
    match:
      event_type: anomaly
      anomaly.app_proto: nfs
      anomaly.event: request_to_client
- filter:
    count: 0
    match:
      event_type: anomaly
      anomaly.app_proto: nfs
      anomaly.event: malformed_data
