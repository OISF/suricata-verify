requires:
  min-version: 9

pcap: input.pcap

args:
  - -k none

checks:
  # set+mask 24 fires once per unique /24 prefix, not once per host address
  - filter:
      count: 2
      match:
        event_type: alert
        alert.signature_id: 1
  # first IP in 192.168.1.0/24 triggers the set
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: "192.168.1.5"
  # second IP from the same /24 does not trigger set (prefix already present)
  - filter:
      count: 0
      match:
        event_type: alert
        src_ip: "192.168.1.99"
  # first IP in 192.168.2.0/24 triggers the set
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: "192.168.2.1"
  # fourth packet from 192.168.1.0/24 does not trigger set again
  - filter:
      count: 0
      match:
        event_type: alert
        src_ip: "192.168.1.200"
