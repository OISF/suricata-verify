requires:
  min-version: 9

pcap: input-mixed.pcap

args:
  - -k none

checks:
  - filter:
      count: 2
      match:
        event_type: alert
  - filter:
      count: 2
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: "192.168.1.5"
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: "fc00::1"
  - filter:
      count: 0
      match:
        event_type: alert
        src_ip: "1.2.3.4"
