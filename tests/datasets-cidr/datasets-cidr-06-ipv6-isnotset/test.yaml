requires:
  min-version: 9

pcap: ../datasets-cidr-05-ipv6-isset/input-ipv6.pcap

args:
  - -k none

checks:
  - filter:
      count: 2
      match:
        event_type: alert
  - filter:
      count: 2
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: "2001:db8::1"
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: "fe80::1"
  - filter:
      count: 0
      match:
        event_type: alert
        src_ip: "fc00::1"
  - filter:
      count: 0
      match:
        event_type: alert
        src_ip: "fd12:3456::1"
