requires:
  min-version: 9

pcap: input.pcap

args:
  - -k none

checks:
  # set fires only once per unique source address (new entry only)
  - filter:
      count: 2
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: "1.2.3.4"
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: "5.6.7.8"
