requires:
  min-version: 9

pcap: ../datasets-cidr-01-ipv4-isset/input-ipv4.pcap

args:
  - -k none

checks:
  - filter:
      count: 8
      match:
        event_type: alert
  - filter:
      count: 3
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: "192.168.1.5"
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: "10.0.0.50"
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: "172.17.0.1"
  - filter:
      count: 5
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      count: 5
      match:
        event_type: alert
        alert.signature_id: 2
        dest_ip: "8.8.8.8"
