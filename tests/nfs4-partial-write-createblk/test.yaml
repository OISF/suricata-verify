# A partial (incomplete) NFSv4 compound request where the leading op's
# argument size depends on a declared length / union discriminant, before
# the WRITE: the RPC fragment claims a 4200-byte record but only the
# visible bytes are present (PUTFH + CREATE (6) of a block device (ftype=NF4BLK: the createhow4 union carries an 8-byte nfset4 device number before the filename + attribute list) + WRITE with a claimed 4096-byte
# payload). The scanner must advance exactly the wire size of the leading
# op (the declared bitmap length / the union case) to still find the WRITE
# and reject it mid-flow; a wrong advance lands inside the WRITE args or
# misreads the next op tag, the scan aborts, and the oversized WRITE is
# never rejected while the record keeps buffering toward the claimed
# (up to 31-bit RPC length) record size.

requires:
  min-version: 8.0.7

pcap: input.pcap
args:
  - --set app-layer.protocols.nfs.max-write-size=1024

checks:
  - shell:
      args: test "$(grep -Ec 'write_request_too_large' eve.json)" -ge 1
  - shell:
      args: test "$(grep -Ec 'malformed_data' eve.json)" -eq 0
  - shell:
      args: test "$(grep -Ec 'too_many_transactions' eve.json)" -eq 0
  # the rejected WRITE is logged mid-flow (pcap_cnt present) with the file
  # transaction completed, not left open
  - filter:
      count: 1
      match:
        event_type: nfs
        nfs.procedure: "38"
        nfs.file_tx: true
        pcap_cnt: 7
  - filter:
      count: 1
      match:
        event_type: flow
        app_proto: nfs
