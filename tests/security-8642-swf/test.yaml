requires:
  min-version: 7.0.17
  features:
    - ASAN

args:
  - --set app-layer.protocols.http.libhtp.default-config.swf-decompression.enabled=yes
  - --set app-layer.protocols.http.libhtp.default-config.swf-decompression.decompress-depth=2147483640

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 9000001

  - filter:
      count: 1
      match:
        event_type: stats
        stats.app_layer.flow.http: 1
