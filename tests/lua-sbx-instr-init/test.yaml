requires:
  features:
    - HAVE_LUA
  min-version: 9

pcap: ../lua-output-http/input.pcap

args:
  - --set security.lua.allow-rules=true
  - --set security.lua.max-instructions=500

checks:
  # init() must succeed (fresh budget), so the engine starts and matches.
  - filter:
      count: 6
      match:
        alert.signature_id: 1
