requires:
  min-version: 8.0.7

pcap: input.pcap


checks:
  # A garbage datagram (64 bytes of 0xFF: marker claim of 0x7FFFFFFF on a
  # 64B buffer) arrives on a flow that was already locked in as NFS by a
  # valid LOOKUP request/reply pair. Before the fix this was dropped
  # silently by parse_udp_ts (Incomplete/Error swallowed, ok() returned);
  # now it must raise malformed_data (attached to a minimal transaction,
  # the only emission channel for applayer anomalies on UDP) and the
  # flow is abandoned by the engine. The LOOKUP transaction proves the
  # flow was locked in before the corruption.
  - shell:
      args: test "$(grep -Ec 'malformed_data' eve.json)" -ge 1
  - filter:
      count: 1
      match:
        event_type: nfs
        nfs.procedure: LOOKUP
