# Test partial (incomplete) NFSv4 compound reply with a non-aligned
# compound tag: a one-byte tag carries 3 bytes of XDR padding. The scan
# must consume the tag with its padding; before the fix it consumed
# tag_len bytes only, so every later read shifted 3 bytes early, the
# compound looked like it carried no operations, and the oversized READ
# reply (claim 4096 > max-read-size 1024) was buffered toward the claimed
# record length instead of being rejected.
#
# Run with: --set app-layer.protocols.nfs.max-read-size=1024

requires:
  min-version: 8.0.7

pcap: input.pcap
args:
  - --set app-layer.protocols.nfs.max-read-size=1024

checks:
  - shell:
      args: test "$(grep -Ec 'read_response_too_large' eve.json)" -ge 1
  - shell:
      args: test "$(grep -Ec 'malformed_data' eve.json)" -eq 0
  - shell:
      args: test "$(grep -Ec 'too_many_transactions' eve.json)" -eq 0
  # the rejected READ response is logged mid-flow with the file
  # transaction completed, not left open
  - filter:
      count: 1
      match:
        event_type: nfs
        nfs.procedure: READ
        nfs.file_tx: true
        pcap_cnt: 11
  - filter:
      count: 1
      match:
        event_type: flow
        app_proto: nfs
