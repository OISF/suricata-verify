requires:
  min-version: 9

args:
  # the synthetic capture carries zeroed checksums
  - -k
  - none
  - --set app-layer.protocols.nfs.enabled=yes

pcap: input.pcap

checks:
  # The GETATTR reply advertises maxread/maxwrite via FATTR4_MAXREAD/MAXWRITE
  # (bits 30/31, word[0] covers bits 0-31), but the compound is only
  # PUTFH+GETATTR: it names no object of its own, so it opens no transaction
  # (mainline parity, cf. sv-master nfs4-gss-unwrap-fail). The attrs are still
  # parsed, which the ceiling anomaly below proves.
  - filter:
      count: 0
      match:
        event_type: nfs
        nfs.version: 4
        nfs.procedure: GETATTR
        nfs.type: response
  # the 4096-byte write exceeds the advertised 2048 maxwrite: advisory
  # anomaly, data still tracked
  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.app_proto: nfs
        anomaly.event: fsinfo_too_large
  - filter:
      count: 1
      match:
        event_type: nfs
        nfs.version: 4
        nfs.procedure: WRITE
        nfs.type: response
        rpc.xid: 1610612738
  - filter:
      count: 1
      match:
        event_type: fileinfo
        fileinfo.size: 4096
  - shell:
      args: test "$(grep -Ec 'malformed_data' eve.json)" -eq 0
