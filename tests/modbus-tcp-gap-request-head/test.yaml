requires:
  min-version: 9

pcap: input.pcap

args:
  - -k none

checks:
  - filter:
      count: 0
      match:
        event_type: alert
  - filter:
      count: 19
      match:
        event_type: modbus
        src_ip: 10.128.0.0
        modbus.request.function_raw: 3
  - filter:
      count: 20
      match:
        event_type: modbus
        src_ip: 10.128.0.1
        modbus.request.function_raw: 3
  - filter:
      count: 20
      match:
        event_type: modbus
        src_ip: 10.128.0.0
        modbus.response.function_raw: 3
  - filter:
      count: 20
      match:
        event_type: modbus
        src_ip: 10.128.0.1
        modbus.response.function_raw: 3
  - filter:
      count: 1
      match:
        event_type: stats
        stats.app_layer.error.modbus.gap: 0
