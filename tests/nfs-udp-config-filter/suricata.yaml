%YAML 1.1
---
app-layer:
  protocols:
    nfs:
      enabled: yes
      tcp:
        enabled: no
      udp:
        enabled: yes
      filter:
        - read
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - nfs:
            enabled: yes
        - flow
