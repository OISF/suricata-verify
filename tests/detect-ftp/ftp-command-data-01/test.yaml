pcap: ../../bug-3519/input.pcap

requires:
  min-version: 8

checks:

  - filter:
      requires:
        lt-version: 9
      count: 1
      match:
        event_type: alert
        ftp.command: USER
        ftp.command_data: anonymous
        alert.signature_id: 1

  # Alert metadata never logs USER/PASS arguments since 9.0.
  - filter:
      requires:
        min-version: 9
      count: 1
      match:
        event_type: alert
        ftp.command: USER
        alert.signature_id: 1
        not-has-key:
          - ftp.command_data

  - filter:
      requires:
        lt-version: 9
      count: 1
      match:
        event_type: alert
        ftp.command: PASS
        ftp.command_data: anonymous
        alert.signature_id: 2

  - filter:
      requires:
        min-version: 9
      count: 1
      match:
        event_type: alert
        ftp.command: PASS
        alert.signature_id: 2
        not-has-key:
          - ftp.command_data

  - filter:
      count: 1
      match:
        event_type: alert
        ftp.command: RETR
        ftp.command_data: temp.txt
        alert.signature_id: 3

  - filter:
      count: 1
      match:
        event_type: alert
        ftp.command: PORT
        ftp.command_data: 192,168,0,13,234,10
        alert.signature_id: 4
