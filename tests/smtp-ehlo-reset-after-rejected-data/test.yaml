requires:
  min-version: 9

pcap: input.pcap

checks:
  # The mid-session EHLO resets the rejected DATA attempt like a RSET
  # (RFC 5321 4.1.4), so two transactions are logged.
  - filter:
      count: 2
      match:
        event_type: smtp

  # Transaction 1: the abandoned envelope-less DATA attempt.
  - filter:
      count: 1
      match:
        event_type: smtp
        tx_id: 0
        smtp.helo: client.example.com
        not-has-key: ["smtp.mail_from", "smtp.rcpt_to[0]", "email.from"]

  # Transaction 2: the delivered message, fully parsed in a fresh
  # transaction untouched by the stale DATA state.
  - filter:
      count: 1
      match:
        event_type: smtp
        tx_id: 1
        smtp.mail_from: <bob@example.com>
        smtp.rcpt_to[0]: <alice@example.com>
        email.from: bob@example.com
        email.to[0]: alice@example.com
        email.status: PARSE_DONE
        not-has-key: ["smtp.rcpt_to[1]", "email.to[1]"]

  # Only the rejected first DATA and the duplicate HELO field are
  # flagged. In particular there is no UNPARSABLE_CONTENT: the second
  # DATA belongs to the new transaction.
  - filter:
      count: 2
      match:
        event_type: anomaly

  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.event: DATA_COMMAND_REJECTED

  - filter:
      count: 1
      match:
        event_type: anomaly
        anomaly.event: DUPLICATE_FIELDS

  - filter:
      count: 0
      match:
        event_type: anomaly
        anomaly.event: UNPARSABLE_CONTENT
