# Two TLS flows, both carrying a ClientHello whose legacy version field is
# 0x0303 (TLS 1.2) and both followed by an application-data record:
#   flow A (10.0.2.5 -> 172.16.0.10:443): the hello's extensions length is
#     bogus (0xffff with no extension bytes), so the hello decode fails, the
#     phase advance is suppressed, and only the following application data
#     moves the track to the data phase;
#   flow B (10.0.2.6 -> 172.16.0.11:443): a valid hello (the control).
#
# tls.version must match the version actually decoded from a hello. The
# decoded test used to be "the track moved past the hello state", which flow A
# satisfies through the application-data record, so tls.version:1.2 matched an
# undecoded flow. The alert must only come from the valid flow.
#
# The pcap is crafted by craft-pcap.py (see that file); the malformed
# extensions length is flagged by tshark as Error/Malformed.
requires:
  min-version: 9

pcap: input.pcap

args:
  - -k none

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: 10.0.2.6
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 1
        src_ip: 10.0.2.5
