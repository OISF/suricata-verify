%YAML 1.1
---
requires:
  min-version: 9

args:
  # inline makes it easier to reason about pcap_cnt
  - -k none --set stream.inline=true

pcap: input.pcap

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 10
        # headers are complete at this packet; the trailer block only arrives at #8
        pcap_cnt: 4
