%YAML 1.1
---
requires:
  min-version: 9

args:
  # inline makes it easier to reason about pcap_cnt
  - -k none --set stream.inline=true

pcap: input.pcap

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 20
        # the buffer engine runs from its own state, so the rule is decided where the
        # header data is complete, well before the trailer block arrives
        pcap_cnt: 5
