requires:
  min-version: 9

pcap: tunnels.pcap

checks:
  - filter:
      count: 1
      match:
        event_type: flow
        proto: "ICMP"
        tunnel_id: 1
  - filter:
      count: 1
      match:
        event_type: flow
        proto: "ICMP"
        tunnel_id: 2
  - filter:
      count: 0
      match:
        event_type: flow
        tunnel_id: 3
  - filter:
      count: 2
      match:
        event_type: alert
        alert.signature_id: 1
