requires:
  min-version: 9
args:
  - -k none
  - --set app-layer.protocols.imap.enabled=yes
pcap: input.pcap

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 101
        flow.src_port: 42010
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 102
        flow.src_port: 42010
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A1 LIST "" %
        imap.responses.__len: 3
        imap.responses[0]: '* LIST (\HasNoChildren) "/" INBOX'
        imap.responses[2]: A1 OK LIST completed
        src_port: 42010
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A2 LIST "" Archive/%
        imap.responses.__len: 2
        imap.responses[1]: A2 OK LIST completed
        src_port: 42010
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A3 LSUB "" *
        imap.responses.__len: 2
        imap.responses[1]: A3 OK LSUB completed
        src_port: 42010
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A4 FETCH 1:* (FLAGS)
        imap.responses.__len: 2
        imap.responses[1]: A4 OK FETCH completed
        src_port: 42010
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A5 NOOP
        imap.responses[0]: A5 OK NOOP completed
        src_port: 42010
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 201
        flow.src_port: 42020
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 202
        flow.src_port: 42020
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A1 STORE 1 +FLAGS \Seen
        imap.responses[0]: '* 1 FETCH (FLAGS (\Seen))'
        imap.responses[1]: A1 OK STORE completed
        src_port: 42020
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A2 STORE 1 FLAGS \Seen \Deleted
        imap.responses[1]: A2 OK STORE completed
        src_port: 42020
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A3 STORE 2:4 -FLAGS.SILENT \Answered
        imap.responses[0]: A3 OK STORE completed
        src_port: 42020
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A4 STORE 1 +FLAGS (\Seen)
        imap.responses[1]: A4 OK STORE completed
        src_port: 42020
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: A5 NOOP
        imap.responses[0]: A5 OK NOOP completed
        src_port: 42020
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.requests[0]: A1 ID ("name" "value ) ( \"quoted\" \\folder")
        imap.responses.__len: 1
        imap.responses[0]: A1 OK ID completed
        src_port: 42030
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.requests[0]: A2 FETCH 1 BODYSTRUCTURE
        imap.responses.__len: 2
        imap.responses[0]: '* 1 FETCH (BODYSTRUCTURE ("TEXT" "PLAIN" ("NAME" "a)b") NIL NIL "7BIT" 12 1))'
        imap.responses[1]: A2 OK FETCH completed
        src_port: 42030
  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests.__len: 1
        imap.requests[0]: A3 NOOP
        imap.responses.__len: 1
        imap.responses[0]: A3 OK NOOP completed
        src_port: 42030
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 301
        flow.src_port: 42030
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 302
        flow.src_port: 42030
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 303
        flow.src_port: 42030
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 1
  - stats:
      app_layer.error.imap.parser: 0
