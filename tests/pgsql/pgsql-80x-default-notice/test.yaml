requires:
    min-version: 8.0.8

args:
- -k none --set stream.midstream=true --set stream.inline=true

pcap: ../pgsql-events/UnknownMessage.pcap

checks:
    - shell:
        requires:
          lt-version: 9
        args: grep "Protocol detector and parser enabled by default for PGSQL" stdout | grep "Notice" | wc -l
        expect: 1
