requires:
  min-version: 8.0.7

args:
  - -k none

checks:
  # Two SELECT queries, one right after the gap
  - filter:
      count: 2
      match:
        event_type: alert
  # Three pgsql transactions: Startup, and two queries.
  # We don't see the connection termination in the pcap
  - filter:
      count: 3
      match:
        event_type: pgsql
