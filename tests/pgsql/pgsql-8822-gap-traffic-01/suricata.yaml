%YAML 1.1
---

outputs:
   - eve-log:
       enabled: yes
       filetype: regular #regular|syslog|unix_dgram|unix_stream|redis
       filename: eve.json
       types:
         - pgsql:
             enabled: yes
         - alert
         - flow

app-layer:
  protocols:
    pgsql:
      enabled: yes
