requires:
  features:
    - HAVE_LUA
  min-version: 8
  # The Lua script builds its output filename at runtime, so Suricata cannot
  # declare it and the Landlock sandbox denies the write. Running under
  # Landlock needs the output directory in security.landlock.directories.write,
  # which the test does not control.
  skip-env:
    - SV_LANDLOCK

pcap: ../filestore-v2.1-forced/suricata-update-pdf.pcap

checks:
  - file-compare:
      filename: 6-172.16.1.68-162.209.114.75-58384-80
      expected: expected/6-172.16.1.68-162.209.114.75-58384-80
  - file-compare:
      filename: http-6-172.16.1.68-162.209.114.75-58384-80
      expected: expected/http-6-172.16.1.68-162.209.114.75-58384-80
