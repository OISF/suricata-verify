%YAML 1.1
---
# Minimal configuration for this test only.

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - nfs:
            enabled: yes
        - files
        - alert
        - anomaly:
            enabled: yes
            types:
              applayer: yes
        - stats:
            totals: yes
            threads: no
  - file-store:
      version: 2
      enabled: yes
      force-filestore: yes
      stream-depth: 0
      write-fileinfo: true
