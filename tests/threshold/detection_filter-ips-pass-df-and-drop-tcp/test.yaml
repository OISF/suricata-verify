requires:
  min-version: 8.0.8

pcap: ../detection_filter-ids-alert-tcp-stream/input.pcap

args:
  - -k none
  - --simulate-ips

checks:
  # The drop rule wins on data segment 1 (pass not yet at its count) and
  # drops the flow, so the pass rule never trips.
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
        alert.action: blocked
        pcap_cnt: 4
  - filter:
      count: 1
      match:
        event_type: flow
        flow.action: drop
  - filter:
      count: 1
      match:
        event_type: stats
        stats.detect.engines[0].rules_loaded: 2
        stats.detect.engines[0].rules_failed: 0
        stats.detect.alert: 1
        stats.detect.alerts_suppressed: 1
        stats.ips.accepted: 3
        stats.ips.blocked: 15
        stats.ips.drop_reason.rules: 1
        stats.ips.drop_reason.flow_drop: 14
        stats.ips.drop_reason.threshold_detection_filter: 0
