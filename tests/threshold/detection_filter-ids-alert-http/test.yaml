requires:
  min-version: 8.0.8

pcap: input.pcap

args:
  - -k none

checks:
  # Counting is per HTTP transaction: txs 3-5 alert.
  - filter:
      count: 3
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        tx_id: 3
  - filter:
      count: 6
      match:
        event_type: alert
        alert.signature_id: 2
  - filter:
      count: 1
      match:
        event_type: stats
        stats.detect.engines[0].rules_loaded: 2
        stats.detect.engines[0].rules_failed: 0
        stats.detect.alert: 9
        stats.detect.alerts_suppressed: 3
