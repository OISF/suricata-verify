requires:
  min-version: 8.0.8

pcap: ../detection_filter-ips-drop-udp/input.pcap

args:
  - -k none
  - --simulate-ips

checks:
  # Datagrams 3-4 match the pass rule, which ends processing before the drop
  # rule's detection_filter is evaluated, so they are not counted: the drop
  # trips on datagram 6 instead of 4.
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 1
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
        alert.action: blocked
        pcap_cnt: 6
  - filter:
      count: 0
      match:
        event_type: flow
        flow.action: drop
  - filter:
      requires:
        lt-version: 9
      count: 1
      match:
        event_type: stats
        stats.detect.engines[0].rules_loaded: 2
        stats.detect.engines[0].rules_failed: 0
        stats.detect.alert: 1
        stats.detect.alerts_suppressed: 3
        stats.ips.accepted: 5
        stats.ips.blocked: 1
        stats.ips.drop_reason.rules: 1
        stats.ips.drop_reason.flow_drop: 0
        stats.ips.drop_reason.threshold_detection_filter: 0
  - filter:
      requires:
        min-version: 9
      count: 1
      match:
        event_type: stats
        stats.detect.engines[0].rules_loaded: 2
        stats.detect.engines[0].rules_failed: 0
        stats.detect.alert: 3
        stats.detect.alerts_suppressed: 3
        stats.ips.accepted: 5
        stats.ips.blocked: 1
        stats.ips.drop_reason.rules: 1
        stats.ips.drop_reason.flow_drop: 0
        stats.ips.drop_reason.threshold_detection_filter: 0
