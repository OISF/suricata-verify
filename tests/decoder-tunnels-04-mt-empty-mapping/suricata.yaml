%YAML 1.1
---

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert

decoder:
  tunnels:
    - id: 1
      type: erspan2
      src: 192.168.1.4
      dst: 192.168.1.2
      session: 321
    - id: 2
      type: vxlan
      src: 192.168.1.3
      dst: 192.168.1.2
      session: 123

multi-detect:
  enabled: yes
  selector: tunnel
  loaders: 1

  tenants:
  - id: 1
    yaml: a.yaml

  mappings:
  - tunnel-id:
    tenant-id: 1
