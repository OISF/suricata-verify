%YAML 1.1
---
# A partial (incomplete) NFSv4 compound reply where an earlier, completed
# within-limit READ precedes the oversized one: PUTFH response + a
# 513-byte READ (data fully present; XDR-padded to 516 bytes on the wire)
# + a READ claiming 8192 bytes whose data is absent. The padding matters:
# the scan must consume it when skipping the first READ or the next opcode
# is read from the padding and the oversized READ is missed. Before the
# fix the scan stopped at the FIRST successful READ (or at the padding),
# so the oversized later READ was never rejected while the record was
# still incomplete and its payload was buffered before the limit ran.
# After the fix the first completed within-limit READ (data + padding) is
# skipped and the second READ is rejected mid-flow.

requires:
  min-version: 8.0.7

pcap: input.pcap
args:
  - --set app-layer.protocols.nfs.max-read-size=1024

checks:
  - shell:
      args: test "$(grep -Ec 'read_response_too_large' eve.json)" -ge 1
  - shell:
      args: test "$(grep -Ec 'malformed_data' eve.json)" -eq 0
  - shell:
      args: test "$(grep -Ec 'too_many_transactions' eve.json)" -eq 0
  # the rejected (2nd) READ response is logged mid-flow with the file
  # transaction completed, not left open
  - filter:
      count: 1
      match:
        event_type: nfs
        nfs.procedure: READ
        nfs.file_tx: true
        pcap_cnt: 11
  - filter:
      count: 1
      match:
        event_type: flow
        app_proto: nfs
