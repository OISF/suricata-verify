args:
- --set stats.interval=3600

requires:
  min-version: 8.0.8

checks:
  - filter:
      # toserver
      count: 0
      match:
        alert.signature_id: 1

  - filter:
      # toclient
      count: 89
      match:
        alert.signature_id: 2

  - filter:
      # both
      count: 0
      match:
        alert.signature_id: 3

  - filter:
      # either
      count: 89
      match:
        alert.signature_id: 4

  - filter:
      count: 1
      match:
        stats.flow.elephant: 1
        stats.flow.elephant_toserver: 0
        stats.flow.elephant_toclient: 1

  - filter:
      count: 1
      match:
        event_type: flow
        flow.elephant: true
        flow.elephant_direction: ["toclient"]
