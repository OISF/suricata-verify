requires:
  min-version: 8.0.8

args:
  - -k none

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 9100001

  - filter:
      count: 1
      match:
        event_type: http
        http.url: "/malicious-xxx"

  - filter:
      count: 0
      match:
        event_type: http
        http.url: "/benign-aaaaaa"

  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 9100002
