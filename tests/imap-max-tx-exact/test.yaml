requires:
  min-version: 9

args:
  - -k none
  - --set app-layer.protocols.imap.enabled=yes
  - --set app-layer.protocols.imap.max-tx=2

checks:
  # A third transaction completes the oldest open one, and parsing goes on.
  - filter:
      count: 2
      match:
        event_type: anomaly
        anomaly.app_proto: imap
        anomaly.event: too_many_transactions

  - filter:
      count: 2
      match:
        event_type: alert
        alert.signature_id: 2244000
        imap.requests[0]: "A1 NOOP"

  - filter:
      count: 1
      match:
        event_type: imap
        imap.requests[0]: "A3 NOOP"

  - stats:
      app_layer.error.imap.parser: 0

  # An invalid line at max-tx raises no event rather than ending the open
  # transactions, so the server literal being consumed is kept intact.
  - filter:
      count: 1
      match:
        event_type: imap
        src_port: 40444
        imap.requests[0]: "A1 FETCH 1 BODY[]"
        imap.responses.__len: 2
        imap.responses[0]: "* 1 FETCH (BODY[] {36})"
        imap.responses[1]: "A1 OK FETCH completed"
  - filter:
      count: 1
      match:
        event_type: imap
        src_port: 40444
        imap.requests[0]: "A2 NOOP"
        imap.responses[0]: "A2 OK NOOP completed"

  # A reply matching no command at max-tx is dropped without ending the open
  # transactions; too_many_transactions is raised once there is room.
  - filter:
      count: 4
      match:
        event_type: imap
        src_port: 40445
  - filter:
      count: 1
      match:
        event_type: imap
        src_port: 40445
        imap.requests[0]: "B1 NOOP"
        imap.responses[0]: "B1 OK NOOP completed"
  - filter:
      count: 1
      match:
        event_type: imap
        src_port: 40445
        imap.requests[0]: "B2 NOOP"
        imap.responses[0]: "B2 OK NOOP completed"
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2244000
        flow.src_port: 40445
        not-has-key: imap
