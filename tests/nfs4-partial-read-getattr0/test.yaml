%YAML 1.1
---
# A partial (incomplete) NFSv4 compound reply with an empty GETATTR result
# (attr_cnt=0) before the READ: the RPC fragment claims a 4156-byte record
# but only 204 bytes are present (GETATTR result with an empty attribute
# bitmap + READ with a claimed 4096-byte data blob). Before the fix the scan
# delegated the GETATTR result to the regular parser, which reads a first
# bitmap word even for attr_cnt=0, so the READ op tag was consumed as that
# bitmap word and the next tag read was misaligned: the scan aborted, the
# oversized READ was never rejected and the reply kept buffering toward the
# claimed (up to 31-bit RPC length) record size. After the fix the scan
# advances exactly the declared bitmap count and rejects the READ mid-flow.

requires:
  min-version: 8.0.7

pcap: input.pcap
args:
  - --set app-layer.protocols.nfs.max-read-size=1024

checks:
  - shell:
      args: test "$(grep -Ec 'read_response_too_large' eve.json)" -ge 1
  - shell:
      args: test "$(grep -Ec 'malformed_data' eve.json)" -eq 0
  - shell:
      args: test "$(grep -Ec 'too_many_transactions' eve.json)" -eq 0
  # the rejected READ response is logged mid-flow (pcap_cnt present) with
  # the file transaction completed, not left open
  - filter:
      count: 1
      match:
        event_type: nfs
        nfs.procedure: READ
        nfs.file_tx: true
        pcap_cnt: 11
  - filter:
      count: 1
      match:
        event_type: flow
        app_proto: nfs
