%YAML 1.1
---
# A partial (incomplete) NFSv4 compound request: the RPC fragment claims a
# 4196-byte record but only 240 bytes of the compound are present (PUTFH +
# WRITE with a claimed 4096-byte payload). Before the fix the partial-record
# path only special-cased NFSv3 WRITE/READ; an NFSv4 COMPOUND fell through to
# the generic incomplete handling, which buffers toward the claimed (up to
# 31-bit RPC length) record size and never runs the size limit, so nothing is
# logged. After the fix the compound is scanned up to the WRITE op's claimed
# length and the record is rejected and skipped mid-flow.

requires:
  min-version: 9

pcap: input.pcap
args:
  - --set app-layer.protocols.nfs.max-write-size=1024

checks:
  - shell:
      args: test "$(grep -Ec 'write_request_too_large' eve.json)" -ge 1
  - shell:
      args: test "$(grep -Ec 'malformed_data' eve.json)" -eq 0
  - shell:
      args: test "$(grep -Ec 'too_many_transactions' eve.json)" -eq 0
  # the rejected WRITE is logged mid-flow (pcap_cnt present) with the file
  # transaction completed, not left open
  - filter:
      count: 1
      match:
        event_type: nfs
        nfs.procedure: "38"
        nfs.file_tx: true
        pcap_cnt: 7
  - filter:
      count: 1
      match:
        event_type: flow
        app_proto: nfs
