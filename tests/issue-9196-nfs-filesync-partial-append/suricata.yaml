%YAML 1.1
---

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - anomaly:
            enabled: yes
            types:
              applayer: yes
        - nfs
        - files:
            force-hash: [sha256]
        - flow
        - stats:
            totals: yes
            threads: no
            deltas: no
