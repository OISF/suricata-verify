requires:
  min-version: 9

pcap: input.pcap

args:
  - -k none

checks:
  # chunk 1 opens the attachment, the server rejects it with 552: the tx is
  # completed by the rejection, the open file must still be closed truncated
  # (same as the chunk-then-QUIT case in smtp-bdat-mime-abandoned)
  - filter:
      count: 1
      match:
        event_type: fileinfo
        fileinfo.filename: att.bin
        fileinfo.state: TRUNCATED
