%YAML 1.1
---

# security.lua.max-bytes bounds what a script allocates and retains; the
# inspected buffer the engine pushes for the call is not script memory.
# A same-size transform of a 100 KB body (input + output, well under the
# 300 KB cap for the script's own allocations) must succeed.

requires:
  min-version: 9

pcap: input.pcap

args:
  - --set default-rule-path=${TEST_DIR}
  - --set security.lua.allow-rules=true
  - --set security.lua.max-bytes=300000
  - --set app-layer.protocols.http.libhtp.default-config.response-body-limit=1mb
  - --set app-layer.protocols.http.libhtp.default-config.response-body-inspect-window=1mb
  - --set app-layer.protocols.http.libhtp.default-config.response-body-minimal-inspect-size=1mb

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
  - stats:
      transform.lua.memory_limit_errors: 0
