requires:
  min-version: 8.0.8

pcap: ../../lua-output-http/input.pcap

args:
  - --set default-rule-path=${TEST_DIR}
  - --set security.lua.allow-rules=true

checks:
  # register() must raise a Lua error, the transform must not run, and
  # the original URI must still match the content keyword.
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
