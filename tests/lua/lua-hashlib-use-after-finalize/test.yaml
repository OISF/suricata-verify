pcap: ../../cond-log-dns-dig/input.pcap

requires:
  features:
    - HAVE_LUA
  min-version: 8.0.7

args:
  - --set security.lua.allow-rules=true
  - --set default-rule-path=${TEST_DIR}
  - -k none

exit-code: 0

# Each Lua hashlib method must be guarded against use
# after the hash context has been consumed.
checks:
  - filter:
      count: 1
      match:
        event_type: stats
        stats.detect.lua.errors: 9
        stats.detect.lua.blocked_function_errors: 0

  - filter:
      count: 0
      match:
        event_type: alert
