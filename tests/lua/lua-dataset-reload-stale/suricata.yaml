%YAML 1.1
---

rule-files:
  - test.rules

security:
  lua:
    allow-rules: true

datasets:
  defaults:
    memcap: 100 MiB
    hashsize: 2048

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert

  - lua:
      enabled: yes
      scripts-dir: .
      scripts:
        - output.lua
