requires:
  min-version: 9

pcap: ../lua-flowintlib/rootx5.pcap

args:
  - --set default-rule-path=${TEST_DIR}
  - --set security.lua.allow-rules=true

checks:
  # Decoded binary data must not be truncated at the first NUL byte:
  # LuaBase64Decode pushes the result with lua_pushstring() (C string
  # semantics) instead of lua_pushlstring() with the decoded length.
  - filter:
      count: 5
      match:
        event_type: alert
        alert.signature_id: 1
