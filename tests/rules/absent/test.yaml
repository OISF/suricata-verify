requires:
    min-version: 8
    pcap: false

args:
    - --engine-analysis

checks:
# 8.0.x reports the absent options as an or_else boolean
- filter:
    filename: rules.json
    requires:
      lt-version: 9
    count: 1
    match:
      id: 6
      engines[2].name: "http_referer"
      engines[2].matches[0].name: "absent"
      engines[2].matches[0].absent.or_else: true
      engines[2].matches[1].name: "content"
      engines[2].matches[1].content.negated: true
- filter:
    filename: rules.json
    requires:
      lt-version: 9
    count: 1
    match:
      id: 7
      engines[2].name: "http_referer"
      engines[2].matches[0].name: "absent"
      engines[2].matches[0].absent.or_else: true
      engines[2].matches[1].name: "pcre"
      engines[2].matches[1].pcre.negated: true
- filter:
    filename: rules.json
    requires:
      lt-version: 9
    count: 1
    match:
      id: 8
      engines[2].name: "http_referer"
      engines[2].matches[0].name: "absent"
      engines[2].matches[0].absent.or_else: false
      engines[2].matches.__len: 1
# 9.0 reports them as a mode string
- filter:
    filename: rules.json
    requires:
      min-version: 9
    count: 1
    match:
      id: 6
      engines[2].name: "http_referer"
      engines[2].matches[0].name: "absent"
      engines[2].matches[0].absent.mode: "or_else"
      engines[2].matches[1].name: "content"
      engines[2].matches[1].content.negated: true
- filter:
    filename: rules.json
    requires:
      min-version: 9
    count: 1
    match:
      id: 7
      engines[2].name: "http_referer"
      engines[2].matches[0].name: "absent"
      engines[2].matches[0].absent.mode: "or_else"
      engines[2].matches[1].name: "pcre"
      engines[2].matches[1].pcre.negated: true
- filter:
    filename: rules.json
    requires:
      min-version: 9
    count: 1
    match:
      id: 8
      engines[2].name: "http_referer"
      engines[2].matches[0].name: "absent"
      engines[2].matches[0].absent.mode: "only"
      engines[2].matches.__len: 1
