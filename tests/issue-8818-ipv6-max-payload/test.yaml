requires:
  min-version: 9

args:
  - -k none

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1

  - filter:
      count: 1
      match:
        event_type: stats
        stats.decoder.udp: 1
        stats.defrag.ipv6.fragments: 46
        stats.defrag.ipv6.reassembled: 1
