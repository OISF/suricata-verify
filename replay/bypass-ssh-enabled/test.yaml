requires:
  min-version: 9
  os: linux
  features:
    - EBPF
  files:
    - ebpf/xdp_filter.bpf

tcpreplay_args:
  - --pps=100

timeout: 1

pcap: ../../tests/bypass-ssh-enabled/input.pcap

args:
- --set af-packet.0.xdp-filter-file=${SRCDIR}/ebpf/xdp_filter.bpf
- -k none
- --set app-layer.protocols.ssh.encryption-handling=bypass

checks:
  - filter:
      count: 1
      match:
        event_type: stats
        stats.flow.end.state.capture_bypassed: 1
  - filter:
      count: 1
      match:
        event_type: flow
        flow.bypassed.pkts_toserver.__gt: 0
        flow.bypassed.pkts_toclient.__gt: 0
        flow.bypassed.bytes_toserver.__gt: 0
        flow.bypassed.bytes_toclient.__gt: 0
