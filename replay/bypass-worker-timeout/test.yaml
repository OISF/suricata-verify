requires:
  min-version: 9
  os: linux
  features:
    - EBPF
  files:
    - ebpf/xdp_filter.bpf

args:
  - --set af-packet.0.xdp-filter-file=${SRCDIR}/ebpf/xdp_filter.bpf

timeout: 25

checks:
  # a packet lost at capture shows here and not as a wrong flow count
  - stats:
      capture.kernel_drops: 0
  - stats:
      flow_bypassed.closed: 100
  - shell:
      args: grep "Unable to delete entry" stdout stderr | wc -l | xargs
      expect: 0
